function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
class RNG {
  constructor(seed) { this.seed = seed >>> 0; this.s = this.seed | 0; }
  next() {
    const a = (this.s = (this.s + 0x6D2B79F5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  d6() { return 1 + Math.floor(this.next() * 6); }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  weighted(items, wf) { let tot = 0; for (const it of items) tot += Math.max(0, wf(it)); let x = this.next() * tot; for (const it of items) { x -= Math.max(0, wf(it)); if (x <= 0) return it; } return items[items.length - 1]; }
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// --- Esagoni "flat-top", coordinate offset odd-q (colonne dispari spostate in basso)
const SQ3 = Math.sqrt(3);
const HEX = 40; // raggio esagono in unità mondo
// Direzioni in coordinate assiali, ordinate per angolo (30°, 90°, 150°, 210°, 270°, 330°)
// Il lato i è compreso fra i vertici i e i+1.
const DIRS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];
function offToAx(c, r) { return [c, r - ((c - (c & 1)) >> 1)]; }
function axToOff(q, s) { return [q, s + ((q - (q & 1)) >> 1)]; }
function axDist(a, b) { const dq = a[0] - b[0], dr = a[1] - b[1]; return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2; }
function hexCenter(c, r) { return [HEX * 1.5 * c + HEX, HEX * SQ3 * (r + 0.5 * (c & 1)) + HEX * SQ3 / 2]; }
function hexCorner(cx, cy, i, size = HEX) { const a = Math.PI / 180 * 60 * i; return [cx + size * Math.cos(a), cy + size * Math.sin(a)]; }
function edgeKey(a, b) { return a < b ? a + '_' + b : b + '_' + a; }

// --- Rumore a valori con fbm
function makeNoise(rng) {
  const P = new Float32Array(512); for (let i = 0; i < 512; i++) P[i] = rng.next();
  const perm = []; for (let i = 0; i < 256; i++) perm.push(i); rng.shuffle(perm);
  const pp = perm.concat(perm);
  const v = (x, y) => P[pp[(pp[x & 255] + y) & 511]];
  const sm = t => t * t * (3 - 2 * t);
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = v(xi, yi), b = v(xi + 1, yi), c = v(xi, yi + 1), d = v(xi + 1, yi + 1);
    const u = sm(xf), w = sm(yf);
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  }
  return function fbm(x, y, oct = 4) { let s = 0, amp = 1, f = 1, tot = 0; for (let o = 0; o < oct; o++) { s += amp * n2(x * f, y * f); tot += amp; amp *= 0.5; f *= 2.03; } return s / tot; };
}

// Coda di priorità minima (binary heap)
class PQ {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(item, pr) { const a = this.a; a.push([pr, item]); let i = a.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } }
  pop() { const a = this.a; const top = a[0]; const last = a.pop(); if (a.length) { a[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < a.length && a[l][0] < a[m][0]) m = l; if (r < a.length && a[r][0] < a[m][0]) m = r; if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m; } } return top[1]; }
}

class GameMap {
  constructor(W, H) {
    this.W = W; this.H = H;
    this.hexes = [];
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
      const [q, s] = offToAx(c, r);
      const [x, y] = hexCenter(c, r);
      this.hexes.push({ id: r * W + c, c, r, q, s, x, y, terrain: 'pianura', base: 'pianura', elev: 0, moist: 0, region: -1,
        state: 'normale', feature: null, owner: null, key: false, road: false });
    }
    this.edges = new Map();      // edgeKey -> {type, high?}
    this.roadLinks = new Set();  // edgeKey dei collegamenti stradali
    this.roads = [];             // [{path:[hexId...], main:bool}]
    this.rivers = [];            // [[[x,y]...]] polilinee dei vertici
    this.labels = [];            // etichette di regione
    this.regions = [];
    this.pxW = HEX * 1.5 * W + HEX * 0.5 + HEX;
    this.pxH = HEX * SQ3 * (H + 0.5) ;
  }
  at(c, r) { return (c < 0 || r < 0 || c >= this.W || r >= this.H) ? null : this.hexes[r * this.W + c]; }
  ax(q, s) { const [c, r] = axToOff(q, s); return this.at(c, r); }
  nb(h, i) { const d = DIRS[i]; return this.ax(h.q + d[0], h.s + d[1]); }
  neighbors(h) { const out = []; for (let i = 0; i < 6; i++) { const n = this.nb(h, i); if (n) out.push(n); } return out; }
  dist(a, b) { return axDist([a.q, a.s], [b.q, b.s]); }
  dirTo(a, b) { for (let i = 0; i < 6; i++) { const d = DIRS[i]; if (a.q + d[0] === b.q && a.s + d[1] === b.s) return i; } return -1; }
  edge(a, b) { return this.edges.get(edgeKey(a.id, b.id)) || null; }
  setEdge(a, b, e) { this.edges.set(edgeKey(a.id, b.id), e); }
  within(h, d) { const out = []; for (const x of this.hexes) if (this.dist(h, x) <= d) out.push(x); return out; }
  isBorder(h) { return h.c === 0 || h.r === 0 || h.c === this.W - 1 || h.r === this.H - 1; }
  half(h) { return h.c < this.W / 2 ? 'O' : 'C'; }
  features() { return this.hexes.filter(h => h.feature); }
  byName(n) { return this.hexes.find(h => h.feature && h.feature.name === n); }
  hexAtPoint(x, y) {
    // conversione pixel -> esagono (flat-top)
    const px = x - HEX, py = y - HEX * SQ3 / 2;
    const qf = (2 / 3 * px) / HEX, rf = (-1 / 3 * px + SQ3 / 3 * py) / HEX;
    let xq = qf, zq = rf, yq = -xq - zq;
    let rx = Math.round(xq), ry = Math.round(yq), rz = Math.round(zq);
    const dx = Math.abs(rx - xq), dy = Math.abs(ry - yq), dz = Math.abs(rz - zq);
    if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
    return this.ax(rx, rz);
  }
  // Grafo dei vertici: ogni segmento è un lato d'esagono
  buildVertexGraph() {
    const V = new Map(); // key -> {key,x,y,adj:[{v,edge:[aId,bId|null]}], hexes:Set}
    const vk = (x, y) => Math.round(x * 10) + ',' + Math.round(y * 10);
    const getV = (x, y) => { const k = vk(x, y); let v = V.get(k); if (!v) { v = { key: k, x, y, adj: [], hexes: new Set() }; V.set(k, v); } return v; };
    for (const h of this.hexes) {
      for (let i = 0; i < 6; i++) {
        const [x1, y1] = hexCorner(h.x, h.y, i), [x2, y2] = hexCorner(h.x, h.y, (i + 1) % 6);
        const a = getV(x1, y1), b = getV(x2, y2);
        a.hexes.add(h.id); b.hexes.add(h.id);
        const n = this.nb(h, i);
        if (!a.adj.some(e => e.v === b)) { a.adj.push({ v: b, a: h.id, b: n ? n.id : null }); b.adj.push({ v: a, a: h.id, b: n ? n.id : null }); }
      }
    }
    this.V = V;
    return V;
  }
}

class MapContext {
  constructor(scn, seed) {
    this.scn = scn; this.seed = seed;
    this.rng = new RNG(seed ^ hashStr(scn.id));
    const [W, H] = scn.size;
    this.map = new GameMap(W, H);
    this.map.scenarioId = scn.id; this.map.seed = seed;
    this.usedNames = new Set();
    this.notes = [];
    this.riversPlaced = false;
  }
  // ---------- nomi
  name(kind) {
    const r = this.rng;
    for (let k = 0; k < 40; k++) {
      let n;
      if (kind === 'C') n = r.pick(NAMES.chaosPre) + ' ' + r.pick(NAMES.chaosSuf);
      else if (NAMES[kind]) n = r.pick(NAMES[kind]);
      else { const p = r.pick(NAMES.pre), s = r.pick(NAMES.suf); n = s === 'vento' || s === 'sole' || s === 'stella' || s === 'quercia' ? p + ' del ' + s.charAt(0).toUpperCase() + s.slice(1) : p + s; if (s === 'stella' || s === 'quercia') n = p + ' della ' + s.charAt(0).toUpperCase() + s.slice(1); }
      if (!this.usedNames.has(n)) { this.usedNames.add(n); return n; }
    }
    return 'Senza nome';
  }
  // ---------- utilità di posizione: fx, fy in [0,1]
  pt(fx, fy) { const m = this.map; return m.at(Math.round(fx * (m.W - 1)), Math.round(fy * (m.H - 1))); }
  hexNear(fx, fy) { return this.pt(fx, fy); }

}

function generateMap(scn, seed) {
  const ctx = new MapContext(scn, seed);
  ctx.baseFields();
  ctx.assignTerrain();
  ctx.map.buildVertexGraph();
  if (scn.terrainPost) scn.terrainPost(ctx);
  scn.layout(ctx);
  if (scn.lakes !== 0) ctx.lakes(scn.lakes ?? ctx.rng.int(0, 2));
  if (!ctx.riversPlaced && scn.rivers !== 0) ctx.autoRivers();
  if (scn.afterRivers) scn.afterRivers(ctx);
  ctx.roads();
  if (!scn.noFords) ctx.fords();
  ctx.crests();
  if (scn.post) scn.post(ctx);
  ctx.finalizeStates();
  ctx.regions();
  ctx.map.notes = ctx.notes;
  return ctx;
}

// ============================================================
//  SCENARI (cap. 18, 19, 20)
//  Convenzione: l'Ordine occupa la metà ovest, il Caos la metà est.
// ============================================================
const gauss = (x, s) => Math.exp(-(x * x) / (s * s));

// Zone di schieramento (restituiscono un predicato sugli esagoni)
const Z = {
  edge: (d, side) => (m, fac) => { const s = side || (fac === 'O' ? 'W' : 'E'); return h => s === 'W' ? h.c < d : s === 'E' ? h.c >= m.W - d : s === 'N' ? h.r < d : h.r >= m.H - d; },
  nearOwn: (d, alsoPlaces) => (m, fac) => { const own = m.hexes.filter(h => h.feature && h.owner === fac && (TERRAIN[h.terrain].settlement || alsoPlaces)); return h => own.some(o => m.dist(o, h) <= d); },
  near: (names, d) => (m) => { const t = names.map(n => m.byName(n)).filter(Boolean); return h => t.some(o => m.dist(o, h) <= d); },
  ring: (name, a, b) => (m) => { const t = m.byName(name); return h => { const d = m.dist(t, h); return d >= a && d <= b; }; },

// ============================================================
//  ARMATE e SCHIERAMENTO
// ============================================================
const kw = (t, k) => UNITS[t].kw.includes(k);
const isCav = t => kw(t, 'Cavalleria') || kw(t, 'Bestia');
const isBig = t => kw(t, 'Grande');
const isLeader = t => UNITS[t].kind !== 'unit';
const isRanged = t => UNITS[t].P >= 1 && UNITS[t].FM < 2 && UNITS[t].kind === 'unit' && !isBig(t);
const isCaster = t => UNITS[t].FM >= 2 && UNITS[t].kind === 'unit';
const stackPts = t => isLeader(t) ? 0 : isBig(t) ? 2 : 1;

let UID = 1;
function mkUnit(type, fac, extra = {}) { return Object.assign({ uid: UID++, type, fac, hex: null, grade: 'B', dmg: 0, status: [], fm: UNITS[type].FM, commander: false, reserve: false }, extra); }

function parseArmy(str, fac) {
  const out = [];
  for (const part of str.split(';').map(s => s.trim()).filter(Boolean)) {
    const m = part.match(/^(\d+)\s+(.+)$/);
    const n = m ? +m[1] : 1, name = m ? m[2] : part;
    if (!UNITS[name]) { console.warn('Unità sconosciuta', name); continue; }
    for (let i = 0; i < n; i++) out.push(mkUnit(name, fac));
  }
  return out;
}
const armyCost = list => list.reduce((s, u) => s + (UNITS[u.type].costs[u.grade === 'V' ? 1 : 0] || UNITS[u.type].cost), 0);

// Composizione preferita di un'armata a punti (pesi relativi)
const PREFS = {
  O: { 'Fanteria disciplinata': 3, 'Lancieri': 2.2, 'Picchieri': 1.2, 'Scudieri': 0.8, 'Cavalieri': 1.6, 'Cavalieri pesanti': 0.5, 'Cavalieri del Tempio': 0.3, 'Arcieri': 2, 'Arcieri lunghi': 1, 'Balestrieri': 1.1, 'Arcieri elfici': 0.4, 'Esploratori': 0.5, 'Guardie cittadine': 1, "Maghi dell'Ordine": 0.7, 'Maghi elementali': 0.3, 'Sacerdoti': 0.8, 'Guaritori': 0.3, 'Paladini': 0.4, 'Campioni della Legge': 0.25, 'Ranger elfici': 0.4, 'Guardiani del Bosco': 0.3, 'Guerrieri nanici': 0.6, 'Ingegneri nanici': 0.2, 'Cavalieri grifoni': 0.2, 'Golem controllati': 0.2, 'Inquisitori': 0.35 },
  C: { 'Orchi guerrieri': 3, 'Orchi berseker': 1.5, 'Goblin': 2, 'Goblin arcieri': 1.5, 'Goblin genieri': 0.3, 'Troll': 0.8, 'Troll di montagna': 0.3, 'Ogre': 0.7, 'Lupi giganti': 1.1, 'Chimere minori': 0.3, 'Scheletri': 0.6, 'Zombie': 0.3, 'Spettri': 0.3, 'Guerrieri del Caos': 1, 'Cavalieri del Caos': 0.4, 'Campioni mutati': 0.2, 'Draghi giovani': 0.15, 'Demoni minori': 0.4, 'Stregoni del Caos': 0.6, 'Sciamani': 0.6, 'Mutanti': 0.6, 'Abomini': 0.2, 'Sciami di insetti corrotti': 0.3 },
};
const HEROES = { O: ['Kael', 'Lyria', 'Theron', 'Seris', 'Capitano'], C: ['Gorath', 'Veyla', 'Korgash', 'Zhara', 'Capobanda'] };
const BOSSES = { O: ['Arcimago del Concilio', 'Gran Maestro dei Cavalieri', 'Re-Sacerdote'], C: ['Drago Antico', 'Signore del Caos', 'Demone Maggiore', 'Stregone Supremo del Caos'] };

function buildArmy(fac, points, opt, rng, taken) {
  const list = []; let left = points;
  const add = (t, grade = 'B') => { const c = UNITS[t].costs[grade === 'V' ? 1 : 0]; list.push(mkUnit(t, fac, { grade })); left -= c; };
  // Boss
  if (opt.boss) { const b = opt.boss === 'random' ? rng.pick(BOSSES[fac]) : opt.boss; add(b); }
  // Eroi
  const nH = opt.heroes ?? 1;
  const pool = rng.shuffle(HEROES[fac].filter(h => !taken.has(h)));
  for (let i = 0; i < nH; i++) { const h = pool.find(x => !taken.has(x) && UNITS[x].cost <= left - 10) || (fac === 'O' ? 'Capitano' : 'Capobanda'); if (h !== 'Capitano' && h !== 'Capobanda') taken.add(h); add(h); }
  // Requisiti
  const req = opt.req || {};
  for (const [k, n] of Object.entries(req)) {
    for (let i = 0; i < n; i++) {
      let t = k;
      if (k === '_sacre') t = rng.pick(['Sacerdoti', 'Inquisitori', 'Sacerdoti', 'Guaritori']);
      if (k === '_caster') t = rng.pick(['Sciamani', 'Stregoni del Caos', 'Sciamani']);
      add(t);
    }
  }
  const prefs = Object.assign({}, PREFS[fac], opt.prefs || {});
  const count = t => list.filter(u => u.type === t).length;
  const ok = t => {
    const c = UNITS[t].cost; if (c == null || c > left) return false;
    if (c >= 9 && count(t) >= 3) return false;
    if (opt.maxCav != null && isCav(t) && list.filter(u => isCav(u.type)).length >= opt.maxCav) return false;
    if (isCaster(t) && list.filter(u => isCaster(u.type)).length >= 3) return false;
    if (count(t) >= 6) return false;
    return true;
  };
  let guard = 0;
  while (left > 0 && guard++ < 200) {
    const cands = Object.keys(prefs).filter(ok);
    if (!cands.length) break;
    // nelle fasi finali preferisce le unità che riempiono bene il budget
    const t = rng.weighted(cands, x => prefs[x] * (left < 8 ? (UNITS[x].cost <= left ? 1 + UNITS[x].cost / 4 : 0) : 1));
    const vet = opt.vet && UNITS[t].costs[1] && rng.chance(0.35) && UNITS[t].costs[1] <= left;
    add(t, vet ? 'V' : 'B');
  }
  return list;
}

function makeArmies(scn, rng) {
  const A = { O: [], C: [] }, taken = new Set(), notes = [];
  for (const fac of ['O', 'C']) {
    if (scn.armies && scn.armies[fac]) { A[fac] = parseArmy(scn.armies[fac], fac); continue; }
    const pts = scn.points && scn.points[fac];
    if (pts == null) continue;
    const opt = { heroes: scn.minHeroes || 1, maxCav: scn.maxCav, prefs: scn.armyPrefs && scn.armyPrefs[fac], req: scn.req && scn.req[fac] };
    if (fac === 'C' && scn.chaosBoss) { opt.boss = scn.chaosBoss; opt.heroes = 0; }
    if (scn.allowBoss && rng.chance(0.4)) { opt.boss = 'random'; opt.heroes = Math.max(0, opt.heroes); }
    if (fac === 'O' && scn.vetO) opt.vet = true;
    if (Array.isArray(pts)) { pts.forEach((p, i) => { const part = buildArmy(fac, p, opt, rng, taken); part.forEach(u => u.player = i + 1); A[fac].push(...part); }); notes.push(`Ordine: ${pts.length} contingenti da ${pts[0]} punti, uno per giocatore cooperativo.`); }
    else A[fac] = buildArmy(fac, pts, opt, rng, taken);
  }
  for (const fac of ['O', 'C']) {
    const L = A[fac]; if (!L.length) continue;
    const cmdName = scn.commanders && scn.commanders[fac];
    const cmd = L.find(u => u.type === cmdName) || L.find(u => UNITS[u.type].kind === 'boss') || L.find(u => UNITS[u.type].kind === 'hero');
    if (cmd) cmd.commander = true;
  }
  return { A, notes };
}

// ------------------------------------------------------------
// Schieramento automatico
// ------------------------------------------------------------
function canStand(m, h, t) {
  if (!h || h.terrain === 'lago') return kw(t, 'Anfibia');
  if (h.terrain === 'montagna' && isCav(t)) return false;
  return true;
}
function stackLoad(units) { let p = 0, l = 0; for (const u of units) { if (isLeader(u.type)) l++; else p += stackPts(u.type); } return { p, l }; }

function formStacks(units, rng) {
  const heroes = units.filter(u => isLeader(u.type));
  const cav = units.filter(u => !isLeader(u.type) && isCav(u.type));
  const ranged = units.filter(u => !isLeader(u.type) && !isCav(u.type) && (isRanged(u.type)));
  const casters = units.filter(u => !isLeader(u.type) && isCaster(u.type));
  const guards = units.filter(u => u.type === 'Guardie cittadine');
  const melee = units.filter(u => !isLeader(u.type) && !isCav(u.type) && !isRanged(u.type) && !isCaster(u.type) && u.type !== 'Guardie cittadine');
  // le unità più forti in testa
  melee.sort((a, b) => (UNITS[b.type].F + UNITS[b.type].D) - (UNITS[a.type].F + UNITS[a.type].D));
  const stacks = [];
  const mk = (role, us) => { const s = { role, units: us }; stacks.push(s); return s; };
  for (const g of guards) mk('garrison', [g]);
  // linee: 2 unità di mischia (o 1 grande) + talvolta un tiratore
  let i = 0;
  while (i < melee.length) {
    const s = mk('line', []);
    while (i < melee.length && stackLoad(s.units).p + stackPts(melee[i].type) <= 3) { s.units.push(melee[i++]); if (s.units.length >= 2) break; }
    if (!s.units.length) s.units.push(melee[i++]);
  }
  for (let k = 0; k < cav.length; k += 2) mk('cav', cav.slice(k, k + 2));
  // tiratori: prima rinforzano le linee (1 per pila), poi pile di supporto
  const lines = stacks.filter(s => s.role === 'line');
  rng.shuffle(lines);
  let li = 0;
  const rest = [];
  for (const r of ranged) { const s = lines[li]; if (s && stackLoad(s.units).p + 1 <= 3 && rng.chance(0.5)) { s.units.push(r); li++; } else rest.push(r); }
  for (let k = 0; k < rest.length; k += 2) mk('support', rest.slice(k, k + 2));
  // eroi: il comandante al centro della linea, gli altri sparsi
  heroes.sort((a, b) => (b.commander ? 1 : 0) - (a.commander ? 1 : 0));
  const lineStacks = stacks.filter(s => s.role === 'line');
  heroes.forEach((h, k) => {
    const s = lineStacks[k] || stacks[k % Math.max(1, stacks.length)] || mk('line', []);
    s.units.push(h); if (h.commander) s.cmd = true;
  });
  // incantatori: con gli eroi o nelle pile di supporto
  for (const c of casters) {
    const s = stacks.find(s => s.units.some(u => isLeader(u.type)) && stackLoad(s.units).p < 4) || stacks.find(s => s.role === 'support' && stackLoad(s.units).p < 3);
    if (s) s.units.push(c); else mk('support', [c]);
  }
  return stacks.filter(s => s.units.length);
}

function deployFaction(m, units, zonePred, fac, target, rng, occupied) {
  const notes = [];
  if (!units.length) return notes;
  let zone = m.hexes.filter(h => zonePred(h) && h.terrain !== 'lago' && !(h.feature && h.owner && h.owner !== fac));
  // niente esagoni con nemici o adiacenti a nemici
  const enemyAt = h => occupied.has(h.id) && occupied.get(h.id) !== fac;
  zone = zone.filter(h => !enemyAt(h) && !m.neighbors(h).some(enemyAt));
  // gli insediamenti neutrali non si occupano allo schieramento
  zone = zone.filter(h => !(h.feature && !h.owner && TERRAIN[h.terrain].settlement));
  if (!zone.length) { notes.push(`Nessun esagono disponibile per lo schieramento di ${FACTION_NAME[fac]}.`); return notes; }
  const stacks = formStacks(units, rng);
  // asse fronte: verso il bersaglio
  const ax = [target.x, target.y];
  const cz = zone.reduce((a, h) => [a[0] + h.x / zone.length, a[1] + h.y / zone.length], [0, 0]);
  let dx = ax[0] - cz[0], dy = ax[1] - cz[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
  const front = h => (h.x - cz[0]) * dx + (h.y - cz[1]) * dy;   // più alto = più avanti
  const lat = h => (h.x - cz[0]) * -dy + (h.y - cz[1]) * dx;
  const fMax = Math.max(...zone.map(front)), latMax = Math.max(1, ...zone.map(h => Math.abs(lat(h))));
  const used = new Map(); // hexId -> stack
  const def = h => -(TERRAIN[h.terrain].melee || 0);
  const own = h => h.feature && h.owner === fac;
  const place = (s, scoreFn, spacing) => {
    let best = null, bs = -Infinity;
    for (const h of zone) {
      if (used.has(h.id)) continue;
      if (!s.units.every(u => canStand(m, h, u.type))) continue;
      let sc = scoreFn(h) + rng.range(0, 0.6);
      for (const [id] of used) { const d = m.dist(h, m.hexes[id]); if (d < spacing) sc -= (spacing - d) * 3; }
      if (sc > bs) { bs = sc; best = h; }
    }
    if (best) { used.set(best.id, s); for (const u of s.units) u.hex = best.id; occupied.set(best.id, fac); }
    return best;
  };
  const order = ['garrison', 'line', 'cav', 'support'];
  stacks.sort((a, b) => order.indexOf(a.role) - order.indexOf(b.role) || (b.cmd ? 1 : 0) - (a.cmd ? 1 : 0));
  const ownPlaces = zone.filter(own).sort((a, b) => (TERRAIN[b.terrain].pv || 0) - (TERRAIN[a.terrain].pv || 0));
  for (const s of stacks) {
    if (s.role === 'garrison') {
      place(s, h => (own(h) ? 20 + (TERRAIN[h.terrain].pv || 0) * 2 : 0) + front(h) / 200, 1);
    } else if (s.role === 'line') {
      place(s, h => (front(h) - fMax) / 40 + def(h) * 1.2 + (own(h) && TERRAIN[h.terrain].castle ? 4 : own(h) ? 1.5 : 0) - (s.cmd ? Math.abs(lat(h)) / latMax * 3 : 0) - (h.terrain === 'palude' ? 2 : 0), 2);
    } else if (s.role === 'cav') {
      place(s, h => (front(h) - fMax) / 50 + Math.abs(lat(h)) / latMax * 3 + (h.terrain === 'pianura' ? 2 : 0) - (h.terrain === 'bosco' || h.terrain === 'palude' ? 3 : 0), 2);
    } else {
      // supporto: subito dietro una pila di linea
      place(s, h => { let near = 0; for (const [id, st] of used) if (st.role === 'line' && m.dist(h, m.hexes[id]) === 1 && front(m.hexes[id]) > front(h)) near = 3; return near + (front(h) - fMax) / 80 + (h.terrain === 'collina' ? 1.5 : 0) + def(h) * 0.3; }, 1);
    }
  }
  // pile non piazzate: unisci dove c'è spazio
  for (const s of stacks) {
    if (s.units[0].hex !== null) continue;
    for (const u of s.units) {
      const h = zone.find(h => { const here = units.filter(x => x.hex === h.id); const l = stackLoad(here.concat([u])); return canStand(m, h, u.type) && l.p <= 4 && l.l <= 2; });
      if (h) { u.hex = h.id; occupied.set(h.id, fac); } else { u.reserve = true; }
    }
  }
  const nRes = units.filter(u => u.hex === null).length;
  if (nRes) notes.push(`${nRes} unità di ${FACTION_NAME[fac]} non trovano posto e restano in riserva.`);
  return notes;
}

function deployAll(ctx, armies) {
  const m = ctx.map, scn = ctx.scn, rng = new RNG(ctx.seed * 7 + 13);
  const units = [];
  const occupied = new Map();
  const notes = [];
  const dep = scn.deploy || { first: scn.first === 'O' ? 'C' : 'O', O: Z_DEFAULT, C: Z_DEFAULT, text: { O: 'entro 3 esagoni dal proprio bordo o dai propri insediamenti', C: 'entro 3 esagoni dal proprio bordo o dai propri insediamenti' } };
  // Caos automatico iniziale (cooperativi)
  if (scn.chaosStart) {
    for (const g of scn.chaosStart(ctx)) for (const t of g.units) { const u = mkUnit(t, 'C', { hex: g.hex.id }); units.push(u); occupied.set(g.hex.id, 'C'); }
  }
  const firstF = dep.first, secondF = firstF === 'O' ? 'C' : 'O';
  for (const fac of [firstF, secondF]) {
    let list = armies[fac]; if (!list || !list.length) continue;
    if (scn.chaosStart && fac === 'C') continue;
    if (fac === 'C' && scn.chaosSplit) {
      // metà dei punti in riserva per il TG 3
      const half = armyCost(list) / 2; let acc = 0; const sorted = [...list].sort((a, b) => (a.commander ? -1 : 0) - (b.commander ? -1 : 0));
      for (const u of sorted) { if (acc < half || u.commander) acc += UNITS[u.type].cost; else { u.reserve = true; u.arrives = 3; } }
      list = list.filter(u => !u.reserve);
      notes.push('Caos: metà dei punti in riserva, entra nel TG 3 da qualsiasi bordo.');
    }
    const pred = dep[fac](m, fac);
    // bersaglio: obiettivo principale o il centro delle forze nemiche già schierate
    const enemyPlaced = units.filter(u => u.fac !== fac && u.hex !== null);
    let target;
    if (enemyPlaced.length) { const xs = enemyPlaced.map(u => m.hexes[u.hex]); target = { x: xs.reduce((s, h) => s + h.x, 0) / xs.length, y: xs.reduce((s, h) => s + h.y, 0) / xs.length }; }
    else {
      const obj = m.hexes.filter(h => h.feature && (h.owner !== fac));
      const enemyHalf = m.hexes.filter(h => m.half(h) !== fac);
      const src = obj.length ? obj : enemyHalf;
      target = { x: src.reduce((s, h) => s + h.x, 0) / src.length, y: src.reduce((s, h) => s + h.y, 0) / src.length };
    }
    notes.push(...deployFaction(m, list, pred, fac, target, rng, occupied));
    units.push(...armies[fac]);
  }
  // Colosso dormiente (19.7)
  if (scn.colossus) { const h = m.hexes.find(h => h.feature && h.feature.name === 'Rovine del Colosso'); units.push(mkUnit('Colosso', 'N', { hex: h.id, status: ['dormiente'] })); }
  // zone di schieramento per il disegno
  const zones = {};
  for (const fac of ['O', 'C']) { if (!dep[fac]) continue; const p = dep[fac](m, fac); zones[fac] = new Set(m.hexes.filter(h => p(h) && h.terrain !== 'lago').map(h => h.id)); }
  return { units, notes, zones, depText: dep.text, depFirst: firstF };
}

// Colosso (nota C, 19.7)
UNITS['Colosso'] = { id: 'Colosso', name: 'Colosso dormiente', fac: 'N', kind: 'boss', V: 2, F: 8, D: 6, P: 0, R: 6, FM: 0, cost: 0, costs: [0], kw: ['Grande', 'Immune al Morale'], ab: 'Dormiente: non può essere attaccato, non esercita ZdC e blocca il suo esagono. Un Eroe adiacente può risvegliarlo con 5+.' };

// ============================================================
//  REGOLE SPECIALI DEGLI SCENARI e condizioni di vittoria
// ============================================================
const SR = {
  hex: (g, n) => g.map.byName(n),
  owner: (g, n) => (g.map.byName(n) || {}).owner,
  win(g, fac, why) { g.whyText = why; return fac; },
  pvWin(g, why) { const w = g.tiebreak(); g.whyText = (why ? why + ' ' : '') + (w === 'draw' ? 'Parità perfetta.' : g.pv('O') === g.pv('C') ? `Punti Vittoria pari (${g.pv('O')} a ${g.pv('C')}): vince ${FACTION_NAME[w]} allo spareggio.` : `Più Punti Vittoria: vince ${FACTION_NAME[w]} (Ordine ${g.pv('O')}, Caos ${g.pv('C')}).`); return w; },
  decap(g) {
    const o = g.commanderDead('C'), c = g.commanderDead('O');
    if (o && c) return SR.pvWin(g, 'Entrambi i Comandanti sono caduti.');
    if (o) return SR.win(g, 'O', 'Il Comandante del Caos è caduto: vince l’Ordine.');
    if (c) return SR.win(g, 'C', 'Il Comandante dell’Ordine è caduto: vince il Caos.');
    return null;
  },
  lostCost(g, fac) { return g.eliminated.filter(e => e.fac === fac && !(g.byUid(e.uid) || {}).summoned).reduce((s, e) => s + (UNITS[e.type].cost || 0), 0); },
  heroesAlive(g, fac) { return g.friends(fac).filter(u => UNITS[u.type].kind === 'hero').length; },
  // Rinforzi: unità Base gratuite piazzate nei siti indicati (i punti in eccesso si perdono)
  reinforce(g, fac, pts, sites, label) {
    const list = buildArmy(fac, pts, { heroes: 0 }, g.rng, new Set());
    let placed = 0;
    for (const u of list) {
      const site = sites.find(h => h && !g.enemyAt(h.id, fac) && g.canStack(h.id, [], [Object.assign({}, u, { hex: h.id })]));
      if (!site) continue;
      const nu = g.spawn(u.type, fac, site.id); nu.moved = false; placed++;
      g.ev({ type: 'recruit', uid: nu.uid, hex: site.id });
    }
    g.say(`${label || 'Rinforzi'}: ${placed} unità per ${FACTION_NAME[fac]}.`, 'turn');
  },
  edgeHexes(g, side) { const m = g.map; return m.hexes.filter(h => side === 'W' ? h.c === 0 : side === 'E' ? h.c === m.W - 1 : side === 'N' ? h.r === 0 : h.r === m.H - 1).filter(h => h.terrain !== 'lago'); },
  band(t) { return t <= 4 ? ['Goblin', 'Orchi guerrieri'] : t <= 8 ? ['Orchi guerrieri', 'Orchi guerrieri', 'Orchi berseker'] : t <= 12 ? ['Troll', 'Orchi guerrieri', 'Orchi guerrieri'] : ['Guerrieri del Caos', 'Troll', 'Demoni minori']; },
  // Generazione del Caos automatico (20.2): nell'esagono e poi negli adiacenti liberi più vicini
  generate(g, h, types) {
    let n = 0;
    for (const t of types) {
      const cands = [h, ...g.map.neighbors(h), ...g.map.within(h, 2)].filter(x => x.terrain !== 'lago' && !g.enemyAt(x.id, 'C'));
      const site = cands.find(x => g.canStack(x.id, [], [{ type: t, fac: 'C', hex: x.id }]) && !(UNITS[t].kw.includes('Cavalleria') && x.terrain === 'montagna'));
      if (!site) continue;
      const u = g.spawn(t, 'C', site.id); u.moved = false; n++;
      g.ev({ type: 'recruit', uid: u.uid, hex: site.id });
    }
    return n;
  },
  carry(g, name) { return g.units.find(u => g.alive(u) && u.items.some(i => i.name === name)); },
  drop(g, u, name, hid) { if (u.items.some(i => i.name === name)) { u.items = u.items.filter(i => i.name !== name); (g.flags.dropped = g.flags.dropped || {})[name] = (g.flags.dropped[name] || []).concat([hid]); g.say(`${name} cade a terra in ${g.hexLabel(hid)}.`); } },
  pick(g, us, h, name, who) {
    const d = g.flags.dropped && g.flags.dropped[name]; if (!d || !d.includes(h.id)) return;
    const u = us.find(x => !who || who(x)); if (!u) return;
    d.splice(d.indexOf(h.id), 1);
    u.items.push({ name, special: true });
    g.say(`${UNITS[u.type].name.split(',')[0]} raccoglie: ${name}.`, 'good');
  },
};

const SCN_RULES = {
  '18.1': {

      return null;
    },
    final(g) { return SR.win(g, 'C', 'La Frattura non è stata chiusa in tempo.'); },
  },
  '20.6': {
    init(g) {
      const h = g.friends('O').find(u => UNITS[u.type].kind === 'hero') || g.friends('O')[0];
      if (h) { h.items.push({ name: 'Lama del Giuramento Spezzato', special: true }); h.portatore = true; }
    },
    startTurn(g, fac) {
      if (fac !== 'C' || g.turn !== 3) return;
      const res = g.units.filter(u => u.fac === 'C' && u.reserve && !u.dead);
      const edges = ['N', 'E', 'S', 'W'].flatMap(s => SR.edgeHexes(g, s));
      const O = g.friends('O'); const far = h => Math.min(...O.map(o => g.map.dist(g.hexOf(o), h)), 99);
      edges.sort((a, b) => far(a) - far(b));
      for (const u of res) {
        const site = edges.find(h => far(h) > 1 && !g.enemyAt(h.id, 'C') && g.canStack(h.id, [], [Object.assign({}, u, { hex: h.id })]) && g.canEnterTerrain(u, h));
        if (site) { u.reserve = false; u.hex = site.id; u.moved = false; u.startHex = site.id; g.ev({ type: 'recruit', uid: u.uid, hex: site.id }); }
      }
      g.say('La seconda ondata del Caos entra in mappa.', 'turn');
    },
    death(g, u, hid) { SR.drop(g, u, 'Lama del Giuramento Spezzato', hid); },
    arrive(g, us, h) {
      SR.pick(g, us, h, 'Lama del Giuramento Spezzato');
      const c = SR.carry(g, 'Lama del Giuramento Spezzato');
      if (c && c.fac === 'O' && g.isLeader(c) && h.terrain === 'tempio' && us.includes(c)) g.flags.bladeHome = true;
    },
    check(g) {
      if (g.flags.bladeHome) return SR.win(g, 'O', 'Il Portatore raggiunge il Santuario con la Lama.');
      const c = SR.carry(g, 'Lama del Giuramento Spezzato');
      if (g.hold('blade', c && c.fac === 'C') >= 2) return SR.win(g, 'C', 'Il Caos si impadronisce della Lama.');
      return null;
    },
    final(g) { return SR.win(g, 'C', 'Il Portatore non è arrivato in tempo.'); },
  },
  '20.7': {
    finalPhase(g, fac) {
      if (fac !== 'C') return;
      const cor = g.map.hexes.filter(h => h.state === 'corrotto');
      for (const h of cor) {
        const opts = g.map.neighbors(h).filter(n => n.state !== 'corrotto' && n.terrain !== 'lago');
        if (!opts.length) continue;
        opts.sort((a, b) => (b.key - a.key) || (b.state === 'purificato' ? -1 : 0));
        const t = opts[0];
        const r = g.rng.d6() + (g.map.neighbors(t).some(n => g.unitsAt(n.id).some(u => u.fac === 'C' && g.isCaster(u))) ? 1 : 0);
        if (r >= 5) { g.corruptHex(t); }
      }
    },
    check(g) {
      const keys = g.map.hexes.filter(h => h.key);
      const T = g.map.hexes.find(h => h.key && (h.terrain === 'tempio' || h.terrain === 'altare'));
      if (keys.filter(h => h.state === 'corrotto').length >= 6 || (T && T.state === 'corrotto')) return SR.win(g, 'C', 'Il Contagio dilaga sugli esagoni chiave.');
      if (!g.friends('C').some(u => g.isCaster(u)) && Object.keys(g.flags.seals).length) return SR.win(g, 'O', 'Incantatori del Caos eliminati e Fenditura Sigillata.');
      return null;
    },
    final(g) {
      const cor = g.map.hexes.filter(h => h.state === 'corrotto').length;
      const cities = g.map.hexes.filter(h => h.key && TERRAIN[h.terrain].settlement);
      if (cor < 4 && cities.every(h => h.owner === 'O')) return SR.win(g, 'O', 'Il Contagio è contenuto.');
      return SR.pvWin(g);
    },
  },
  '20.8': {
    startTurn(g, fac) { if (fac === 'O' && g.turn === 12) SR.reinforce(g, 'O', 40, SR.edgeHexes(g, 'W'), 'Rinforzi dell’Ordine'); },
    check(g) {
      const keys = g.map.hexes.filter(h => h.key);
      if (keys.every(h => h.owner === 'C')) return SR.win(g, 'C', 'Il Caos espugna la Roccaforte.');
      const boss = g.units.find(u => u.fac === 'C' && UNITS[u.type].kind === 'boss');
      if (boss && boss.dead && SR.lostCost(g, 'C') >= g.initialCost.C * 0.6) return SR.win(g, 'O', 'Il Boss è caduto e l’assedio è spezzato.');
      return null;
    },
    final(g) { return SR.win(g, 'O', 'La Roccaforte resiste.'); },
  },
};

// ============================================================
//  MOTORE: stato della partita, caratteristiche, effetti
// ============================================================
const OTHER = { O: 'C', C: 'O' };
const GRADE_NAME = { B: 'Base', V: 'Veterano', E: 'Elite' };
const STATUS_NAME = { disgregato: 'Disgregato', stanco: 'Stanco', esausto: 'Esausto', vacillante: 'Vacillante', furia: 'In Furia', corrotto: 'Corrotto', dormiente: 'Dormiente' };

class Game {
  constructor(opt) {
    // opt: {scn, seed, map, units, human: 'O'|'C'|null}
    this.scn = opt.scn; this.seed = opt.seed; this.map = opt.map; this.units = opt.units;
    this.human = opt.human === undefined ? 'O' : opt.human;
    this.rng = new RNG((opt.seed * 2654435761) >>> 0);
    this.turn = 1; this.first = opt.scn.first || 'O'; this.active = this.first;
    this.phase = 'deploy'; this.step = 0;     // step di combattimento: 0 magie, 1 tiro, 2 mischia, 3 azioni speciali
    this.pti = 0;                             // indice progressivo dei turni giocatore
    this.gold = { O: (opt.scn.gold && opt.scn.gold.O) ?? 10, C: (opt.scn.gold && opt.scn.gold.C) ?? 10 };
    if (opt.scn.coop) this.gold.C = 0;
    this.pvElim = { O: 0, C: 0 };
    this.eliminated = [];                     // {type, fac, uid, commander}
    this.log = []; this.events = [];
    this.streak = {};                         // contatori "per N turni consecutivi"
    this.flags = { onceAscension: {}, takenPlace: {}, relic: null, blade: null, seals: {}, passed: 0, ritual: false, mutationUsed: {} };
    this.meleeTargets = new Set();
    this.special = new Set();                 // esagoni già bersaglio di Corruzione/Purificazione nel turno
    this.winner = null; this.result = null;
    this.initialChaosValue = 0;
    this.nextUid = Math.max(0, ...this.units.map(u => u.uid)) + 1;
    for (const u of this.units) this.initUnit(u);
    this.initialCost = { O: armyCost(this.units.filter(u => u.fac === 'O')), C: armyCost(this.units.filter(u => u.fac === 'C')) };
    for (const h of this.map.hexes) { h.breaches = h.breaches || 0; h.sacked = h.sacked || 0; h.siege = 0; h.everOwned = h.owner ? { [h.owner]: true } : {}; }
    if (SCN_RULES[this.scn.id] && SCN_RULES[this.scn.id].init) SCN_RULES[this.scn.id].init(this);
  }
  initUnit(u) {
    u.dmg = u.dmg || 0; u.status = u.status || []; u.pe = u.pe || 0; u.mutF = u.mutF || 0; u.mutR = u.mutR || 0;
    u.items = u.items || []; u.effects = u.effects || []; u.corruptCount = u.corruptCount || 0;
    u.fm = this.maxFM(u); this.resetTurnFlags(u);
  }
  resetTurnFlags(u) { u.moved = false; u.mpUsed = 0; u.attacked = false; u.casts = 0; u.advanced = false; u.flew = false; u.acted = false; u.startHex = u.hex; u.dmgPhase = 0; u.moraleMod = null; u.mustTest = false; }
  // ---------------- registro ed eventi per l'interfaccia
  say(text, kind = 'info') { this.log.push({ t: this.turn, fac: this.active, text, kind }); if (this.log.length > 400) this.log.shift(); }
  ev(e) { this.events.push(e); }
  // ---------------- accesso
  U(t) { return UNITS[t.type || t]; }
  hexOf(u) { return u.hex === null || u.hex === undefined ? null : this.map.hexes[u.hex]; }
  alive(u) { return u.hex !== null && u.hex !== undefined && !u.dead && !u.reserve && !u.exited; }
  unitsAt(hid) { return this.units.filter(u => u.hex === hid && this.alive(u)); }
  enemyAt(hid, fac) { return this.units.some(u => u.hex === hid && this.alive(u) && u.fac !== fac && u.fac !== 'N'); }
  blockedAt(hid, fac) { return this.units.some(u => u.hex === hid && this.alive(u) && u.fac !== fac); }
  friends(fac) { return this.units.filter(u => u.fac === fac && this.alive(u)); }
  byUid(id) { return this.units.find(u => u.uid === id); }
  isLeader(u) { const k = this.U(u).kind; return k === 'hero' || k === 'boss' || u.ascended; }
  isBoss(u) { return this.U(u).kind === 'boss'; }
  has(u, k) { return this.U(u).kw.includes(k); }
  ab(u, name) { return (this.U(u).ab || '').includes(name); }
  st(u, s) { return u.status.includes(s); }
  addStatus(u, s) { if (!u.status.includes(s)) u.status.push(s); }
  delStatus(u, s) { u.status = u.status.filter(x => x !== s); }
  setVacillante(u) { this.addStatus(u, 'vacillante'); u.vacUntil = this.pti + (u.fac === this.active ? 2 : 1); }
  item(u, name) { return u.items.find(i => i.name === name); }
  // ---------------- caratteristiche modificate
  maxR(u) { let r = this.U(u).R + (u.grade !== 'B' ? 1 : 0) + u.mutR + (u.ascended ? 1 : 0); if (this.item(u, 'Elmo delle Corna Rotte')) r++; return r; }
  curR(u) { return this.maxR(u) - u.dmg; }
  maxFM(u) {
    let fm = this.U(u).FM;
    if (this.U(u).vet === 'FM' && u.grade !== 'B') fm++;
    for (const it of u.items) { if (it.name === 'Amuleto di Chiarezza' || it.name === 'Amuleto della Fenditura') fm++; if (it.name === 'Cuore della Fenditura') fm += 2; }
    return fm;
  }
  isCaster(u) { return this.maxFM(u) >= 1; }
  effSum(u, k) { let s = 0; for (const e of u.effects) if (e.k === k) s += e.v; return s; }
  gradeBonus(u, stat) {
    const U = this.U(u); let b = 0;
    if (u.grade !== 'B' && U.vet === stat) b++;
    if (u.grade === 'E' && stat === 'D') b++;
    return b;
  }
  stackItemsBonus(u, stat) {
    // oggetti che danno bonus alla pila
    let b = 0; if (!this.alive(u)) return 0;
    for (const o of this.unitsAt(u.hex)) for (const it of o.items) {
      if (stat === 'D' && it.name === 'Stendardo della Disciplina') b++;
      if (stat === 'D' && it.name === 'Pergamena di Barriera (attiva)') b += 3;
      if (stat === 'D' && it.name === "Scudo dell'Ultimo Baluardo") b += 2;
    }
    if (stat === 'F' && u.fac === 'C') {
      for (const o of this.friends('C')) if (o.items.some(i => i.name === 'Totem del Sangue') && this.map.dist(this.hexOf(o), this.hexOf(u)) <= 1) { b++; break; }
    }
    return b;
  }
  F(u) {
    const U = this.U(u); if (U.F === 0) return 0;
    let f = U.F + this.gradeBonus(u, 'F') + u.mutF + this.effSum(u, 'F');
    for (const it of u.items) { if (it.name === 'Spada della Legge' || it.name === 'Lama Mutante' || it.name === 'Elmo delle Corna Rotte') f++; if (it.name === 'Talismano' && it.stat === 'F') f++; if (it.name === 'Lama del Giuramento Spezzato') f += 3; }
    f += this.stackItemsBonus(u, 'F');
    if (this.st(u, 'disgregato')) f--; if (this.st(u, 'stanco')) f--; if (this.st(u, 'esausto')) f -= 2; if (this.st(u, 'vacillante')) f--;
    if (this.st(u, 'corrotto')) f--;
    if (this.st(u, 'furia')) f += u.type === 'Gorath' ? 2 : (u.furiaBonus || 1);
    if (u.type === 'Orchi berseker' && u.dmg > 0) f++;
    const h = this.hexOf(u);
    if (h && h.terrain === 'palude' && !this.has(u, 'Anfibia')) f--;
    return Math.max(1, f);
  }
  D(u) {
    const U = this.U(u);
    let d = U.D + this.gradeBonus(u, 'D') + this.effSum(u, 'D');
    for (const it of u.items) { if (it.name === 'Scudo del Giuramento' || it.name === 'Elmo del Guardiano') d++; if (it.name === 'Corazza di Scaglie Demoniache') d += 2; if (it.name === 'Talismano' && it.stat === 'D') d++; }
    d += this.stackItemsBonus(u, 'D');
    if (this.st(u, 'disgregato')) d--; if (this.st(u, 'stanco')) d--; if (this.st(u, 'esausto')) d -= 2; if (this.st(u, 'furia')) d--;
    if (u.portatore) d++;
    const h = this.hexOf(u);
    if (h) {
      if (u.type === 'Guardie cittadine' && TERRAIN[h.terrain].settlement && h.owner === 'O') d++;
      if ((u.type === 'Guerrieri nanici' || u.type === 'Troll di montagna') && (h.terrain === 'collina' || h.terrain === 'montagna')) d++;
    }
    return Math.max(1, d);
  }
  V(u) {
    const U = this.U(u);
    if (u.effects.some(e => e.k === 'immobile')) return 0;
    let v = U.V + this.gradeBonus(u, 'V') + this.effSum(u, 'V');
    for (const it of u.items) { if (it.name === 'Corazza di Scaglie Demoniache') v--; if (it.name === 'Talismano' && it.stat === 'V') v++; }
    if (this.st(u, 'stanco')) v--; if (this.st(u, 'esausto')) v -= 2;
    if (this.scn.id === '19.2' && u.fac === 'C' && this.has(u, 'Bestia')) v++;
    return Math.max(1, v);
  }
  P(u, fromHex) {
    let p = this.U(u).P; if (p === 0) return 0;
    const h = fromHex || this.hexOf(u);
    if (h && h.terrain === 'collina' && this.has(u, 'Tiratore')) p++;
    if (this.item(u, 'Arco delle Radici Antiche')) p++;
    return p;
  }
  // Valore di Morale (base, senza modificatori di situazione)
  moraleBase(u) { if (this.isBoss(u)) return 6; if (this.isLeader(u)) return 5; return { B: 3, V: 4, E: 5 }[u.grade]; }
  immuneMorale(u) { return this.has(u, 'Immune al Morale') || this.has(u, 'Non-morto') || this.st(u, 'dormiente'); }
  // ---------------- comando
  outOfCommand(u) {
    if (u.fac !== 'O' || this.isLeader(u)) return false;
    const h = this.hexOf(u); if (!h) return false;
    return !this.friends('O').some(l => this.isLeader(l) && this.map.dist(this.hexOf(l), h) <= 4);
  }
  formation(hid) {
    // 9.4: la pila dell'Ordine con 2 Disciplinate (o una Fanteria disciplinata)
    const us = this.unitsAt(hid).filter(u => u.fac === 'O');
    if (!us.length) return false;
    const h = this.map.hexes[hid];
    const gm = this.friends('O').some(l => l.type === 'Gran Maestro dei Cavalieri' && this.map.dist(this.hexOf(l), h) <= 2);
    const ok = us.filter(u => this.has(u, 'Disciplinata') && !this.st(u, 'disgregato') && (gm || !this.outOfCommand(u)));
    if (us.some(u => this.st(u, 'disgregato'))) return false;
    return ok.length >= 2 || ok.some(u => u.type === 'Fanteria disciplinata');
  }
  // ---------------- effetti a durata
  addEffect(u, k, v, dur, src, fac = this.active) {
    // dur: 'nextOwn' (fino al prossimo turno di chi lancia), 'endTG', 'endNextEnemy', 'endOwnNext'
    const e = { k, v, src };
    if (dur === 'nextOwn') e.expPTI = this.pti + (fac === this.active ? 2 : 1);   // all'inizio del prossimo turno di chi lo crea
    else if (dur === 'endTG') e.expTG = this.turn;
    else if (dur === 'endNextEnemy') e.expEndPTI = this.pti + 1;
    else if (dur === 'endOwnNextOf') e.expEndPTI = this.pti + 2;
    else if (typeof dur === 'number') e.expPTI = this.pti + dur;

  }
  expireStart() { for (const u of this.units) u.effects = u.effects.filter(e => !(e.expPTI !== undefined && e.expPTI <= this.pti)); }
  expireEndPlayerTurn() {
    for (const u of this.units) {
      u.effects = u.effects.filter(e => !(e.expEndPTI !== undefined && e.expEndPTI <= this.pti));
      if (u.vacUntil !== undefined && u.vacUntil <= this.pti) { this.delStatus(u, 'vacillante'); delete u.vacUntil; }
    }
  }
  expireEndTG() {
    for (const u of this.units) { u.effects = u.effects.filter(e => !(e.expTG !== undefined && e.expTG <= this.turn)); this.delStatus(u, 'furia'); u.furiaBonus = 0; }
    for (const h of this.map.hexes) if (h.ash && h.ash <= this.turn) h.ash = 0;
    for (const u of this.units) if (u.summonUntil !== undefined && u.summonUntil <= this.pti && this.alive(u)) { u.dead = true; u.hex = null; this.say(`${this.U(u).name} evocato svanisce.`); }
  }
  // ---------------- controllo e punti
  settlements(fac) { return this.map.hexes.filter(h => TERRAIN[h.terrain].settlement && (fac === undefined || h.owner === fac)); }
  places(fac) { return this.map.hexes.filter(h => h.feature && (fac === undefined || h.owner === fac)); }
  pvTerritory(fac) { let p = 0; for (const h of this.settlements(fac)) p += TERRAIN[h.terrain].pv; return p; }
  pv(fac) {
    let p = this.pvTerritory(fac) + this.pvElim[fac];
    const r = SCN_RULES[this.scn.id];
    if (r && r.pv) p += r.pv(this, fac);
    return p;
  }
  commander(fac) { return this.units.find(u => u.fac === fac && u.commander); }
  commanderDead(fac) { const c = this.commander(fac); return c ? !!c.dead : false; }
  // ---------------- unità nuove
  spawn(type, fac, hid, extra = {}) {
    const u = mkUnit(type, fac, Object.assign({ hex: hid }, extra));
    u.uid = this.nextUid++;
    this.initUnit(u); u.moved = true; u.attacked = false;
    this.units.push(u);
    return u;
  }
  canStack(hid, us, extra = []) {
    const all = this.unitsAt(hid).concat(us.filter(u => u.hex !== hid)).concat(extra);
    let p = 0, l = 0;
    for (const u of all) { if (this.isLeader(u)) l++; else p += this.has(u, 'Grande') ? 2 : 1; }
    return p <= 4 && l <= 2;
  }
  clone() {
    // copia profonda per le simulazioni dell'IA (la mappa condivide la geometria)
    const g = Object.create(Game.prototype);
    Object.assign(g, this);
    g.units = this.units.map(u => Object.assign({}, u, { status: [...u.status], effects: u.effects.map(e => Object.assign({}, e)), items: u.items.map(i => Object.assign({}, i)) }));
    g.map = Object.create(GameMap.prototype); Object.assign(g.map, this.map);
    g.map.hexes = this.map.hexes.map(h => Object.assign({}, h, { everOwned: Object.assign({}, h.everOwned), feature: h.feature && Object.assign({}, h.feature) }));
    g.eliminated = [...this.eliminated]; g.initialCost = this.initialCost; g.recruitedAt = Object.assign({}, this.recruitedAt); g.builtAt = Object.assign({}, this.builtAt);
    g.gold = Object.assign({}, this.gold); g.pvElim = Object.assign({}, this.pvElim);

    g.log = []; g.events = []; g.sim = true;
    g.meleeTargets = new Set(this.meleeTargets); g.special = new Set(this.special);
    g.streak = Object.assign({}, this.streak); g.flags = JSON.parse(JSON.stringify(this.flags));
    return g;
  }
}

// ============================================================
//  MOTORE: movimento (cap. 6 e 8)
// ============================================================
Object.assign(Game.prototype, {
  // Esagoni in Zona di Controllo dei nemici di fac
  zoc(fac) {
    const set = new Set();
    for (const u of this.units) {
      if (!this.alive(u) || u.fac === fac || u.fac === 'N' || this.st(u, 'dormiente')) continue;
      const h = this.hexOf(u);
      for (let i = 0; i < 6; i++) {
        const n = this.map.nb(h, i); if (!n) continue;
        const e = this.map.edge(h, n);
        if (e && e.type === 'fiume') continue;        // la ZdC non attraversa i fiumi
        set.add(n.id);
      }
    }
    return set;
  },
  terrainCost(u, t) {
    const T = TERRAIN[t];
    if (t === 'lago') return this.has(u, 'Anfibia') ? 2 : Infinity;
    if (t === 'montagna') { if (this.has(u, 'Cavalleria') || this.has(u, 'Bestia')) return Infinity; return this.has(u, 'Nanica') ? 2 : 3; }
    if (t === 'collina') return u.type === 'Lyria' ? 1 : this.has(u, 'Pesante') ? 3 : 2;
    if (t === 'bosco') return this.has(u, 'Elfica') ? 1 : this.has(u, 'Pesante') ? 3 : 2;
    if (t === 'palude') return this.has(u, 'Anfibia') ? 1 : this.has(u, 'Pesante') ? 4 : 3;
    return T.cost;
  },
  canEnterTerrain(u, h) { return isFinite(this.terrainCost(u, h.terrain)); },
  sideCost(u, a, b) {
    const e = this.map.edge(a, b); if (!e) return 0;
    switch (e.type) {
      case 'fiume': return this.has(u, 'Anfibia') ? 0 : this.has(u, 'Pesante') ? Infinity : 2;
      case 'guado': return 1;
      case 'ponte': return 0;
      case 'cresta': return e.high === b.id ? 1 : 0;
      case 'mura': return 1;
      case 'barriera': return e.fac === u.fac ? Infinity : 0;
    }
    return 0;
  },
  canFly(u) { return this.has(u, 'Volante') || u.type === 'Spettri'; },
  groupMP(us, forced) {
    let mp = Math.min(...us.map(u => this.V(u)));
    if (forced) mp += 2;
    if (us.every(u => u.elixir)) mp = Math.min(...us.map(u => this.V(u) + 3));
    return mp;
  },
  // Raggiungibilità per un gruppo di unità della stessa pila
  reachable(us, opt = {}) {
    const fac = us[0].fac, start = this.hexOf(us[0]);
    const fly = !!opt.fly && us.every(u => this.canFly(u));
    const elixir = us.every(u => u.elixir);
    const mp = opt.mp ?? this.groupMP(us, opt.forced);
    const zoc = fly ? new Set() : this.zoc(fac);
    const leggera = us.every(u => this.has(u, 'Leggera'));
    const dist = new Map([[start.id, 0]]), prev = new Map();

    const N = Math.ceil(this.map.dist(a, b) * 6);
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy), px = -dy / L * 0.8, py = dx / L * 0.8;
    const blocks = h => h && h !== a && h !== b && (TERRAIN[h.terrain].los || h.ash) && !(h.terrain === 'bosco' && shooter && shooter.every(u => this.ab(u, 'Vista silvana')));
    for (let i = 1; i < N; i++) {
      const t = i / N, x = a.x + dx * t, y = a.y + dy * t;
      const h1 = this.map.hexAtPoint(x + px, y + py), h2 = this.map.hexAtPoint(x - px, y - py);
      if (h1 === h2) { if (blocks(h1)) return false; }
      else if (blocks(h1) && blocks(h2)) return false;
    }
    return true;
  },
  canShoot(u) { return this.canAttack(u) && (this.has(u, 'Tiratore') || this.ab(u, 'Soffio')) && this.P(u) > 0; },
  rangedCandidates(hid) {
    const t = this.map.hexes[hid];
    return this.friends(this.active).filter(u => this.canShoot(u) && this.map.dist(this.hexOf(u), t) <= this.P(u) && this.lineOfSight(this.hexOf(u), t, [u]));
  },
  rangedPreview(shooters, hid) {
    const t = this.map.hexes[hid], defs = this.unitsAt(hid);
    let ft = 0; for (const u of shooters) { let f = this.F(u); if (this.item(u, "Arco d'Ossa Corrotte")) f++; if (this.item(u, 'Arco delle Radici Antiche') && ['bosco', 'collina'].includes(this.hexOf(u).terrain)) f++; if (u.type === 'Lyria' && !u.oathUsed && defs.some(d => d.fac === 'C')) f += 2; ft += f; }
    const shifts = []; const S = (l, v) => { if (v) shifts.push({ label: l, v }); };
    let terr = this.terrainShift(t, 'ranged', shooters, defs);
    if (t.terrain === 'bosco' && shooters.every(u => this.ab(u, 'Vista silvana'))) terr = 0;
    S('Terreno: ' + TERRAIN[t.terrain].name, terr);
    const maxD = Math.max(0, ...defs.map(d => this.D(d)));
    if (!shooters.some(u => this.ab(u, 'Perforante'))) S('Difesa alta', maxD >= 6 ? -2 : maxD >= 4 ? -1 : 0);
    if (defs.some(d => this.ab(d, 'Copertura'))) S('Copertura', -1);
    if (defs.some(d => this.ab(d, 'Sciame'))) S('Sciame', -1);
    if (shooters.some(u => this.ab(u, 'Imboscata') && this.hexOf(u).terrain === 'bosco')) S('Imboscata', 1);
    if (shooters.some(u => this.ab(u, 'Anti-volo')) && defs.some(d => this.has(d, 'Volante'))) S('Anti-volo', 1);
    let tot = shifts.reduce((s, x) => s + x.v, 0);
    if (shooters.length === 1 && shooters[0].type === 'Lyria' && tot < 0) tot++;
    tot = Math.max(-3, Math.min(3, tot));
    const col0 = rangedColumn(ft), col = Math.max(0, Math.min(6, col0 + tot));
    const probs = {}; for (let r = 0; r < 6; r++) { const k = RANGED_TABLE[r][col]; probs[k] = (probs[k] || 0) + 1 / 6; }
    return { ft, col0, shifts, tot, col, colName: RANGED_COLS[col], probs, defs, hex: hid };
  },
  ranged(uids, hid, opt = {}) {
    const t = this.map.hexes[hid];
    const shooters = uids.map(id => this.byUid(id)).filter(u => this.canShoot(u) && this.map.dist(this.hexOf(u), t) <= this.P(u) && this.lineOfSight(this.hexOf(u), t, [u]));
    const defs0 = this.unitsAt(hid);
    if (!shooters.length || !defs0.length || defs0[0].fac === this.active) return { ok: false, why: 'Tiro non valido.' };
    if (this.step > 1) return { ok: false, why: 'I tiri vanno risolti prima della mischia.' };
    this.reactions(hid, shooters);
    const pv = this.rangedPreview(shooters, hid);
    this.step = Math.max(this.step, 1);
    for (const u of shooters) { u.attacked = true; if (u.type === 'Lyria' && pv.defs.some(d => d.fac === 'C')) u.oathUsed = true; }
    const roll = opt.roll || this.rng.d6();
    const res = RANGED_TABLE[roll - 1][pv.col];
    this.ev({ type: 'ranged', from: [...new Set(shooters.map(u => u.hex))], hex: hid, roll, res, col: pv.colName, fac: this.active });
    this.say(`Tiro su ${this.hexLabel(hid)}: FT ${pv.ft} → colonna ${pv.colName}, dado ${roll} → ${res}.`, 'combat');
    const killedBefore = new Set(this.units.filter(u => u.dead).map(u => u.uid));
    const defs = pv.defs;
    if (res !== '—') {
      const n = +res[0];
      if (res[1] === 'E') this.applyDamage(defs, n, { side: 'D', src: 'ranged' });
      else {
        // nD: n unità diverse Disgregate, il resto in danni
        const order = defs.filter(u => !this.isLeader(u)).sort((a, b) => (this.st(a, 'disgregato') - this.st(b, 'disgregato')) || (this.U(a).cost - this.U(b).cost)).concat(defs.filter(u => this.isLeader(u)));
        let k = 0; for (const u of order) { if (k >= n) break; this.disrupt(u); k++; }
        if (n > defs.length) this.applyDamage(defs, n - defs.length, { side: 'D', src: 'ranged' });
      }
      if (shooters.some(u => this.item(u, "Arco d'Ossa Corrotte")) && res[1] === 'E') this.corruptHex(t);
    }
    const killed = this.units.filter(u => u.dead && !killedBefore.has(u.uid));
    this.gainXP(shooters, defs, killed, { melee: false });
    return { ok: true, roll, res, preview: pv };
  },
  // ---------------- danni e stati
  // Assegna i danni come farebbe il proprietario: prima le unità di costo più basso, gli Eroi per ultimi
  applyDamage(us, n, opt = {}) {
    const alive = us.filter(u => this.alive(u));
    if (!alive.length || n <= 0) return 0;
    let dealt = 0;
    // assorbimenti
    for (const u of alive) {
      const shield = u.effects.find(e => e.k === 'shieldFirst');
      if (shield && n > 0) { u.effects = u.effects.filter(e => e !== shield); n--; this.say(`${this.U(u).name.split(',')[0]}: lo Scudo di Fede assorbe un danno.`); }
    }
    const theron = this.friends(alive[0].fac).find(t => t.type === 'Theron' && this.map.dist(this.hexOf(t), this.hexOf(alive[0])) <= 1);
    for (let i = 0; i < n; i++) {
      const cand = alive.filter(u => this.alive(u));
      if (!cand.length) break;
      let pool = cand.filter(u => !this.isLeader(u));
      if (!pool.length) pool = cand;
      pool.sort((a, b) => (this.U(a).cost - this.U(b).cost) || (this.curR(a) - this.curR(b)));
      let v = pool[0];
      if (v.type === 'Korgash' && v.scarTG !== this.pti) { v.scarTG = this.pti; this.say('Korgash ignora il primo danno (Pelle cicatrizzata).'); continue; }
      // Giuramento di protezione di Theron: fino a 2 danni una volta per TG
      if (theron && theron !== v && this.alive(theron) && !this.isLeader(v) && this.curR(v) <= 1 && this.curR(theron) > 2) {
        if (theron.oathTG !== this.turn) { theron.oathTG = this.turn; theron.oathLeft = 2; }
        if (theron.oathLeft > 0) { theron.oathLeft--; v = theron; }
      }
      this.damage(v, 1, opt.src);
      dealt++;
    }
    // Pericolo per l'Eroe
    if (dealt >= 2) for (const u of alive) if (this.alive(u) && this.isLeader(u) && this.rng.d6() === 1) { this.say(`${this.U(u).name.split(',')[0]} è ferito nella mischia (Pericolo per l'Eroe).`, 'bad'); this.damage(u, 1, 'danger'); }
    return dealt;
  },
  damage(u, n, src) {
    if (!this.alive(u)) return;
    u.dmg += n; u.dmgPhase = (u.dmgPhase || 0) + n;
    this.ev({ type: 'damage', uid: u.uid, hex: u.hex, n });
    if (this.curR(u) <= 0) {
      if (u.type === 'Kael' && !u.lastStand) { u.lastStand = true; u.dmg = this.maxR(u) - 1; this.disrupt(u); this.say('Kael, Ultimo baluardo: resta in piedi con 1 R.', 'good'); return; }
      this.eliminate(u, src);
    } else if (this.phase === 'combat' && u.dmgPhase >= Math.ceil(this.maxR(u) / 2)) u.mustTest = true;
  },
  eliminate(u, src) {
    const h = u.hex;
    this.ev({ type: 'death', uid: u.uid, hex: h, fac: u.fac, type2: u.type });
    this.say(`${this.U(u).name.split(',')[0]} ${u.fac === 'O' ? 'dell’Ordine' : u.fac === 'C' ? 'del Caos' : ''} è eliminato.`, 'death');
    u.dead = true; u.deadHex = h; u.hex = null;
    this.eliminated.push({ uid: u.uid, type: u.type, fac: u.fac, commander: u.commander, turn: this.turn });
    if (this.isLeader(u)) {
      const enemy = OTHER[u.fac] || this.active;
      if (u.fac !== 'N') this.pvElim[enemy] += u.commander ? 5 : this.isBoss(u) ? 5 : 2;
      // Test di Morale per chi aveva l'Eroe entro 2
      for (const f of this.friends(u.fac)) if (this.map.dist(this.hexOf(f), this.map.hexes[h]) <= 2) { f.mustTest = true; f.leaderLost = true; }
      if (u.fac !== 'N' && enemy) this.heroLoot(u, enemy);
    }
    const r = SCN_RULES[this.scn.id]; if (r && r.death) r.death(this, u, h);
  },
  disrupt(u) {
    if (!this.alive(u)) return;
    if (u.effects.some(e => e.k === 'noDisrupt') || this.unitsAt(u.hex).some(o => this.item(o, "Scudo dell'Ultimo Baluardo"))) return;
    const sh = this.item(u, 'Scudo del Giuramento');
    if (sh && sh.usedPTI !== this.pti) { sh.usedPTI = this.pti; return; }
    if (this.st(u, 'disgregato')) { this.damage(u, 1, 'disrupt'); return; }
    this.addStatus(u, 'disgregato'); this.delStatus(u, 'furia');
    this.ev({ type: 'status', uid: u.uid, hex: u.hex, s: 'Disgregato' });
    if (u.fac === 'C' && u.grade !== 'B' && !this.isLeader(u)) this.instability(u);
  },
  // ---------------- ritirata (9.8)
  retreatGroup(us, n, enemies) {
    for (const u of us) this.retreat(u, n, enemies);
  },
  retreat(u, n, enemies, missingDamage = true) {
    if (!this.alive(u)) return;
    const enemyHexes = enemies.filter(e => e.hex !== null || e.deadHex !== undefined).map(e => this.map.hexes[e.hex ?? e.deadHex]).filter(Boolean);
    const zoc = this.zoc(u.fac);
    let cur = this.hexOf(u); const path = [cur.id];
    let steps = 0, extra = 0;
    const minD = h => Math.min(...enemyHexes.map(e => this.map.dist(e, h)));
    while (steps < n + extra && extra < 3) {
      const opts = this.map.neighbors(cur).filter(h => !this.blockedAt(h.id, u.fac) && this.canEnterTerrain(u, h) && isFinite(this.sideCost(u, cur, h)) && minD(h) > minD(cur) && !path.includes(h.id));
      if (!opts.length) break;
      const free = opts.filter(h => !zoc.has(h.id));
      const pool = free.length ? free : opts;
      const own = h => (u.fac === 'O' ? -h.c : h.c);
      pool.sort((a, b) => (this.canStack(b.id, [u]) - this.canStack(a.id, [u])) || (minD(b) - minD(a)) || (own(b) - own(a)) || ((TERRAIN[a.terrain].cost || 9) - (TERRAIN[b.terrain].cost || 9)));
      const nx = pool[0];
      cur = nx; path.push(nx.id); steps++;
      if (!free.length) { u.hex = nx.id; this.damage(u, 1, 'retreat'); if (!this.alive(u)) break; }
      if (steps >= n + extra && !this.canStack(cur.id, [u])) extra++;
    }
    if (!this.alive(u)) return;
    const missing = Math.max(0, n - steps);
    u.hex = cur.id;
    if (path.length > 1) { this.ev({ type: 'move', uids: [u.uid], path, fac: u.fac, fast: true, retreat: true }); this.afterArrive([u], cur.id); }
    if (missing && missingDamage) { this.say(`${this.U(u).name.split(',')[0]} non può ritirarsi: ${missing} danno.`, 'bad'); this.damage(u, missing, 'retreat'); }
  },
  // ---------------- morale (cap. 10)
  moraleValue(u, extra = 0) {
    let m = this.moraleBase(u) + extra;
    const h = this.hexOf(u); if (!h) return m;
    let cmd = 0;
    for (const l of this.friends(u.fac)) {
      if (!this.isLeader(l) || l === u) continue;
      const d = this.map.dist(this.hexOf(l), h);
      if (this.isBoss(l) && d <= 2) cmd = Math.max(cmd, 2);
      else if (d === 0 || (l.type === 'Kael' && d <= 2)) cmd = Math.max(cmd, 1);
    }
    m += cmd;
    if (u.fac === 'O' && this.formation(u.hex)) m++;
    if (this.st(u, 'furia')) m++;
    if (TERRAIN[h.terrain].settlement && h.owner === u.fac) m++;
    if (this.unitsAt(u.hex).some(o => this.item(o, 'Stendardo della Disciplina') || o.type === 'Paladini') && u.fac === 'O') m++;
    if (this.st(u, 'disgregato')) m--;
    if (u.dmg >= Math.ceil(this.maxR(u) * 0.75)) m--;
    if (!this.item(u, 'Amuleto di Chiarezza') && !u.portatore) {
      const terror = this.units.some(e => this.alive(e) && e.fac !== u.fac && e.fac !== 'N' && (this.ab(e, 'Terrore') || ['Gorath', 'Korgash', 'Demone Maggiore', 'Drago Antico'].includes(e.type)) && this.map.dist(this.hexOf(e), h) <= (e.type === 'Drago Antico' ? 2 : 1));
      if (terror) m--;
    }
    if ((u.fac === 'O' && h.state === 'corrotto') || (u.fac === 'C' && h.state === 'purificato')) m--;
    if (this.st(u, 'corrotto')) m--;
    if (u.leaderLost) m -= 2;
    if (u.moraleMod) m += u.moraleMod;
    if (this.scn.id === '20.8' && u.fac === 'C' && SR.lostCost(this, 'C') >= this.initialCost.C / 2) m--;
    return m;
  },
  moraleTest(u, mod = 0, cause = '') {
    if (!this.alive(u) || this.immuneMorale(u)) return true;
    if (u.effects.some(e => e.k === 'iron')) return true;
    const v = this.moraleValue(u, mod);
    const r = this.rng.d6();
    const ok = r !== 6 && r <= v;
    this.ev({ type: 'morale', uid: u.uid, hex: u.hex, ok, roll: r, v });
    if (ok) { this.say(`${this.U(u).name.split(',')[0]} supera il Test di Morale (${r} su ${v})${cause ? ' – ' + cause : ''}.`); return true; }
    const rr = this.rng.d6();
    let res = rr;
    if (res === 1 && (this.isLeader(u) || this.unitsAt(u.hex).some(o => o !== u && this.isLeader(o) && o.fac === u.fac))) res = 2;
    const name = this.U(u).name.split(',')[0];
    const enemies = this.units.filter(e => this.alive(e) && e.fac !== u.fac && e.fac !== 'N').sort((a, b) => this.map.dist(this.hexOf(a), this.hexOf(u)) - this.map.dist(this.hexOf(b), this.hexOf(u))).slice(0, 1);
    switch (res) {
      case 1: this.say(`${name} fallisce il Morale (${r}/${v}) e si sbanda: eliminato.`, 'bad'); this.eliminate(u, 'rout'); break;
      case 2: this.say(`${name} fallisce il Morale (${r}/${v}): Rotta.`, 'bad'); this.retreat(u, 2, enemies); this.disrupt(u); break;
      case 3: this.say(`${name} fallisce il Morale (${r}/${v}): Fuga.`, 'bad'); this.retreat(u, 1, enemies); this.disrupt(u); break;
      case 4: this.say(`${name} fallisce il Morale (${r}/${v}): Disgregato.`, 'bad'); this.disrupt(u); break;
      case 5: this.say(`${name} fallisce il Morale (${r}/${v}): Vacillante.`, 'bad'); this.setVacillante(u); break;
      default: this.say(`${name} fallisce il Morale (${r}/${v}) ma tiene.`);
    }
    return false;
  },
  combatMoraleStep() {
    for (const u of this.units) {
      if (!this.alive(u) || !u.mustTest) continue;
      this.moraleTest(u, 0, u.starHit ? 'colpo devastante' : u.leaderLost ? 'Eroe caduto' : 'perdite');
    }
    for (const u of this.units) { u.mustTest = false; u.moraleMod = null; u.leaderLost = false; u.starHit = false; u.dmgPhase = 0; }
  },
  // ---------------- esperienza (13.1)
  gainXP(attackers, defenders, killed, opt) {
    const award = (side, enemiesKilled, survived) => {
      const leaderPresent = side.some(u => this.isLeader(u) && u.fac === 'O');
      for (const u of side) {
        if (!this.alive(u) || this.isLeader(u)) continue;
        let pe = 0;
        if (opt.melee && survived) pe += 1;
        for (const k of enemiesKilled) { if (this.isLeader(k) || k.grade === 'E') pe += 3; else pe += this.U(k).cost <= this.U(u).cost ? 1 : 2; }
        if (opt.melee && side === defenders && TERRAIN[this.map.hexes[opt.hid].terrain].settlement && u.hex === opt.hid) pe += 1;
        if (pe && leaderPresent && u.fac === 'O') pe += 1;
        if (pe) this.addPE(u, pe);
      }
    };
    award(attackers, killed.filter(k => k.fac !== this.active), true);
    award(defenders, killed.filter(k => k.fac === this.active), true);
  },
  vetLimit(fac) { return Math.max(2, this.settlements(fac).length * 2); },
  vetCount(fac) { return this.friends(fac).filter(u => !this.isLeader(u) && u.grade !== 'B').length; },
  addPE(u, n) {
    if (u.grade === 'V' && this.U(u).costs[2] == null) return;
    u.pe += n;
    this.tryAdvance(u);
  },
  tryAdvance(u) {
    if (u.grade === 'E') return;
    const need = u.grade === 'B' ? 4 : 6;
    if (u.pe < need) return;
    if (u.grade === 'V' && this.U(u).costs[2] == null) { u.pe = 0; return; }
    if (this.vetCount(u.fac) >= this.vetLimit(u.fac)) { u.pe = need; u.waitingAdvance = true; return; }
    u.grade = u.grade === 'B' ? 'V' : 'E'; u.pe = 0; u.waitingAdvance = false;
    if (this.U(u).vet === 'FM') u.fm++;
    this.ev({ type: 'promote', uid: u.uid, hex: u.hex, grade: u.grade });
    this.say(`${this.U(u).name} diventa ${GRADE_NAME[u.grade]}!`, 'good');
  },
  instability(u) {
    if (u.fac !== 'C' || u.grade === 'B' || this.isLeader(u)) return;
    const r = this.rng.d6();
    if (r === 1) { u.grade = u.grade === 'E' ? 'V' : 'B'; u.pe = 0; if (u.dmg >= this.maxR(u)) u.dmg = this.maxR(u) - 1; this.say(`${this.U(u).name}: Instabilità, perde un grado.`, 'bad'); }
    else if (r === 6) this.addPE(u, 1);
  },
  mutation(u, mod = 0) {
    if (u.fac !== 'C' || !this.alive(u)) return;
    const r = Math.min(6, this.rng.d6() + mod + (u.items.some(i => i.name === 'Amuleto della Fenditura') ? 1 : 0));
    const name = this.U(u).name.split(',')[0];
    if (r === 1) { this.say(`${name}: la mutazione ferisce (1 danno).`, 'bad'); this.damage(u, 1, 'mutation'); }
    else if (r >= 4 && u.mutF < 2) { u.mutF++; if (r === 6) { u.mutR++; u.dmg = Math.max(0, u.dmg - 1); } this.say(`${name} muta: +1 F${r === 6 ? ' e +1 R' : ''}.`, 'good'); this.ev({ type: 'status', uid: u.uid, hex: u.hex, s: 'Mutazione' }); }
    else this.say(`${name}: la mutazione non ha effetto (${r}).`);
  },
  corruptionTest(u) {
    if (u.fac !== 'O' || !this.alive(u)) return;
    if (['Sacerdoti', 'Paladini', 'Campioni della Legge', 'Inquisitori'].includes(u.type) || this.U(u).ab.includes('immuni al Test di Corruzione')) return;
    if (this.friends('O').some(t => t.type === 'Theron' && this.map.dist(this.hexOf(t), this.hexOf(u)) <= 1)) return;
    if (this.rng.d6() === 1) {
      u.corruptCount++;
      if (u.corruptCount >= 2) { this.say(`${this.U(u).name.split(',')[0]} cede alla Corruzione e diserta!`, 'bad'); this.eliminate(u, 'corruption'); }
      else { this.addStatus(u, 'corrotto'); this.say(`${this.U(u).name.split(',')[0]} diventa Corrotto.`, 'bad'); this.ev({ type: 'status', uid: u.uid, hex: u.hex, s: 'Corrotto' }); }
    }
  },
  hexLabel(hid) { const h = this.map.hexes[hid]; return h.feature ? h.feature.name : String(h.c + 1).padStart(2, '0') + String(h.r + 1).padStart(2, '0'); },
});

// ============================================================
//  MOTORE: magia (cap. 11)
//  target: 'self' (portata 0), 'friendHex', 'friendUnit', 'enemyUnit', 'anyHex', 'enemyHex', 'emptyHex', 'hex'
// ============================================================
const SPELLS = {
  O: [
    { name: 'Barriera di Luce', cost: 3, range: 2, target: 'friendHex', reaction: true, text: 'Le unità amiche in un esagono hanno +2 D fino al tuo prossimo turno.' },
    { name: 'Purga del Caos', cost: 4, range: 3, target: 'enemyUnit', filter: 'evil', dmg: true, text: '3 danni a un Demone, Non-morto o Mutante; l’esagono Corrotto torna Normale.' },
    { name: 'Giuramento di Ferro', cost: 3, range: 2, target: 'friendUnit', text: 'Un’unità amica non può diventare Disgregata e supera i Test di Morale.' },
    { name: 'Luce Guaritrice', cost: 2, range: 2, target: 'friendUnit', filter: 'hurt', text: 'Un’unità amica recupera 2 R e perde lo stato Stanco.' },
    { name: 'Sigillo di Immobilità', cost: 4, range: 3, target: 'enemyUnit', text: 'Un’unità nemica ha V 0 nel suo prossimo turno.' },
    { name: 'Aura di Disciplina', cost: 4, range: 0, target: 'self', text: 'Le unità amiche nell’esagono e adiacenti hanno +1 F e +1 D.' },

  // ================= sequenza del turno
  start() {

  startPlayerTurn() {

    this.step = 0; this.moraleDone = false;

    // A. Manutenzione
    const own = this.friends(fac);
    for (const u of this.units) if (u.fac === fac) { this.resetTurnFlags(u); u.trained = false; }
    for (const u of own) u.fm = this.maxFM(u);
    // rendita

        let g = TERRAIN[h.terrain].gold || 0;

    // cure

      const h = this.hexOf(u);
      if (this.ab(u, 'Rigenerazione') && u.dmg) u.dmg--;
      if ((fac === 'O' && h.terrain === 'tempio' && h.owner === 'O') || (fac === 'C' && (h.terrain === 'altare' || h.terrain === 'fenditura') && h.owner === 'C')) if (u.dmg) u.dmg--;
      if (u.type === 'Guaritori') { const w = this.unitsAt(u.hex).filter(x => x.fac === fac && x.dmg).sort((a, b) => b.dmg - a.dmg)[0]; if (w) w.dmg--; }

      if (u.items.some(i => i.name === 'Cuore della Fenditura') && this.rng.d6() <= 2) this.damage(u, 1, 'item');

    for (const u of this.friends(fac)) {

      }
      // oggetti della fazione avversaria
      if (fac === 'O' && u.items.some(i => ITEMS.min.C.includes(i.name) || ITEMS.mag.C.includes(i.name))) this.corruptionTest(u);
      if (fac === 'C') u.items = u.items.filter(i => !(ITEMS.min.O.includes(i.name) || ITEMS.mag.O.includes(i.name)) || this.rng.d6() !== 1);
      if (u.waitingAdvance) this.tryAdvance(u);
    }
    // assedi prolungati
    for (const h of this.map.hexes) if (h.owner === fac && this.isFortified(h)) {
      if (this.besieged(h)) { h.siege = (h.siege || 0) + 1; if (h.siege >= 3) for (const u of this.unitsAt(h.id)) if (u.fac === fac) this.addStatus(u, 'stanco'); }
      else h.siege = 0;
    }
    const r = SCN_RULES[this.scn.id]; if (r && r.startTurn) r.startTurn(this, fac);
    if (scorte) for (const h of this.map.hexes.filter(h => h.key)) if (this.unitsAt(h.id).some(u => u.fac === 'O') && this.rng.d6() === 1) { const us = this.unitsAt(h.id).filter(u => u.fac === 'O'); this.say(`Scorte esaurite a ${h.feature.name}: 1 danno.`, 'bad'); this.applyDamage(us, 1); }
    this.say(`${FACTION_NAME[fac]}: Manutenzione (+${inc} Oro, totale ${this.gold[fac]}).`, 'turn');
    this.phase = 'recruit';
  },
  // passa alla fase successiva del giocatore attivo
  nextPhase() {
    if (this.winner) return;
    if (this.phase === 'recruit') { this.phase = 'move'; return; }
    if (this.phase === 'move') { this.phase = 'combat'; this.step = 0; this.startCombat(); return; }
    if (this.phase === 'combat') { if (!this.moraleDone) { this.combatMoraleStep(); this.moraleDone = true; } this.finalPhase(); return; }
  },
  startCombat() {
    for (const u of this.friends(this.active)) {
      if (u.type === 'Campioni mutati') { const r = this.rng.d6(); this.addEffect(u, r <= 2 ? 'F' : r <= 4 ? 'D' : 'V', 1, 'endTG', 'Mutazione instabile'); }
      if (u.type === 'Gorath') { if (u.dmg) u.dmg--; else this.addEffect(u, 'F', 1, 'endTG', 'Mutazione continua'); }
    }
  },
  canFury(u) { return this.alive(u) && u.fac === this.active && this.phase === 'combat' && this.step <= 2 && !this.st(u, 'furia') && !this.st(u, 'disgregato') && (this.ab(u, 'Furia') || u.type === 'Gorath' || u.type === 'Capobanda' || this.friends(u.fac).some(l => l.type === 'Signore del Caos' && this.map.dist(this.hexOf(l), this.hexOf(u)) <= 2)); },
  fury(uid) { const u = this.byUid(uid); if (!this.canFury(u)) return false; this.addStatus(u, 'furia'); this.ev({ type: 'status', uid, hex: u.hex, s: 'In Furia' }); this.say(`${this.U(u).name.split(',')[0]} entra In Furia.`); return true; },
  toSpecialStep() { if (this.phase !== 'combat') return; if (!this.moraleDone) { this.combatMoraleStep(); this.moraleDone = true; } this.step = 3; },
  finalPhase() {
    const fac = this.active;
    this.phase = 'final';
    if (fac === 'C') for (const h of this.settlements('C')) this.tryCorruptSettlement(h);
    for (const u of this.friends('O')) if (this.hexOf(u).state === 'corrotto') this.corruptionTest(u);
    for (const u of this.friends(fac)) if ((this.has(u, 'Demone') || this.has(u, 'Non-morto')) && this.hexOf(u).state === 'purificato' && this.rng.d6() === 1) { this.say(`${this.U(u).name} brucia sul suolo Purificato.`, 'bad'); this.damage(u, 1, 'purified'); }
    // profanazione, consacrazione, sigillatura
    for (const h of this.map.hexes) {
      if (!h.feature) continue;
      const key = 'hold' + h.id + fac;
      let cond = false;
      if (fac === 'C' && h.terrain === 'tempio' && h.owner === 'C') cond = true;
      if (fac === 'O' && (h.terrain === 'altare' || h.terrain === 'fenditura') && h.owner === 'O' && this.unitsAt(h.id).some(u => u.fac === 'O' && this.has(u, 'Sacra'))) cond = true;
      this.streak[key] = cond ? (this.streak[key] || 0) + 1 : 0;
      const need = (fac === 'O' && h.terrain === 'fenditura' && this.unitsAt(h.id).some(u => this.item(u, 'Lama del Giuramento Spezzato'))) ? 1 : 2;
      if (this.streak[key] >= need) {
        this.streak[key] = 0;
        if (h.terrain === 'tempio') { h.terrain = 'altare'; h.feature.type = 'altare'; h.feature.profaned = true; h.state = 'corrotto'; h.feature.name = 'Altare di ' + h.feature.name.replace(/^Tempio (di )?/, ''); this.say(`Il Tempio è profanato: ora è ${h.feature.name}!`, 'bad'); }
        else if (h.terrain === 'altare') { h.terrain = 'tempio'; h.feature.type = 'tempio'; h.state = 'purificato'; this.say(`L’Altare è consacrato: ora è un Tempio dell’Ordine.`, 'good'); }
        else { h.terrain = 'rovina'; h.feature.type = 'rovina'; h.explored = true; h.feature.sealed = true; h.owner = null; h.feature.owner = null; h.state = 'normale'; this.flags.seals[h.id] = true; this.say(`La ${h.feature.name} è Sigillata!`, 'good'); }
        this.ev({ type: 'hexstate', hex: h.id, rebuild: true });
      }
    }
    // stati fissi dei luoghi
    for (const h of this.map.hexes) { if (h.terrain === 'tempio' && h.owner === 'O') h.state = 'purificato'; if ((h.terrain === 'altare' || h.terrain === 'fenditura') && h.owner === 'C') h.state = 'corrotto'; }
    const r = SCN_RULES[this.scn.id]; if (r && r.finalPhase) r.finalPhase(this, fac);
    // Totem del Sangue
    for (const u of this.friends(fac)) if (u.items.some(i => i.name === 'Totem del Sangue')) this.instability(u);
    this.expireEndPlayerTurn();
    this.say(`${FACTION_NAME[fac]} termina il turno.`, 'turn');
    // prossimo giocatore o fine del TG
    if (fac === this.first) { this.active = OTHER[fac]; this.startPlayerTurn(); }
    else this.endTG();
  },
  endTG() {
    this.phase = 'endTG';
    this.expireEndTG();
    this.checkVictory();
    if (this.winner) { this.phase = 'over'; this.ev({ type: 'over', winner: this.winner }); return; }
    this.turn++;
    this.active = this.first;
    this.say(`— Turno di Gioco ${this.turn} —`, 'turn');
    this.startPlayerTurn();
  },
  // ================= vittoria
  hold(key, cond) { this.streak[key] = cond ? (this.streak[key] || 0) + 1 : 0; return this.streak[key]; },
  tiebreak() {
    const sc = f => [this.pv(f), this.settlements(f).filter(h => TERRAIN[h.terrain].castle).length, this.eliminated.filter(e => e.fac === OTHER[f] && UNITS[e.type].kind !== 'unit').length, this.friends(f).filter(u => u.grade === 'E').length, this.gold[f]];
    const a = sc('O'), b = sc('C');
    for (let i = 0; i < a.length; i++) { if (a[i] > b[i]) return 'O'; if (b[i] > a[i]) return 'C'; }
    return 'draw';
  },
  checkVictory() {
    const r = SCN_RULES[this.scn.id] || {};
    let w = r.check ? r.check(this) : null;
    // sconfitta immediata (17.5)
    const lost = f => {
      if (this.scn.coop && f === 'C') return false;
      if (!this.friends(f).length && !this.units.some(u => u.fac === f && u.reserve && !u.dead)) return true;
      const had = this.map.hexes.some(h => h.everOwned && h.everOwned[f] && TERRAIN[h.terrain].settlement);
      return had && !this.settlements(f).length;
    };
    const lO = lost('O'), lC = lost('C');
    if (!w && (lO || lC)) w = lO && lC ? 'draw' : lO ? 'C' : 'O';
    if (!w && this.turn >= this.scn.turns) w = r.final ? r.final(this) : this.tiebreak();
    if (w) {
      this.winner = w;
      this.result = this.whyText || (w === 'draw' ? 'Partita pari.' : `Vince ${FACTION_NAME[w]}.`);
      this.say(this.result, 'turn');
    }
  },
});

// ============================================================
//  Creazione di una partita completa da uno scenario
// ============================================================
function newGame(scnId, seed, human) {
  const scn = SCENARIOS.find(s => s.id === scnId);
  UID = 1;
  const ctx = generateMap(scn, seed);
  const { A, notes } = makeArmies(scn, new RNG(seed + 99));
  const dep = deployAll(ctx, A);
  const g = new Game({ scn, seed, map: ctx.map, units: dep.units, human });
  g.dep = dep; g.armyNotes = notes;
  return g;
}

// ============================================================
//  INTELLIGENZA ARTIFICIALE
//  Un generatore che esegue il turno un'azione alla volta (yield dopo ogni
//  azione), così l'interfaccia può animare le mosse dell'avversario.
// ============================================================
const AI = {
  value(g, u) {
    const U = g.U(u); let v = (U.cost || 6) + (u.grade === 'V' ? 3 : u.grade === 'E' ? 6 : 0);
    if (g.isLeader(u)) v *= 1.5; if (u.commander) v += 15; if (u.items.some(i => i.special)) v += 25;
    return v;
  },
  material(g, fac) {
    let s = 0;
    for (const u of g.units) if (u.fac === fac && g.alive(u)) s += this.value(g, u) * (0.35 + 0.65 * g.curR(u) / g.maxR(u)) * (g.st(u, 'disgregato') ? 0.85 : 1);
    return s;
  },
  evaluate(g, fac) {
    const e = OTHER[fac];
    let s = this.material(g, fac) - this.material(g, e);
    s += 4 * (g.pv(fac) - g.pv(e));
    if (g.winner) s += g.winner === fac ? 1000 : g.winner === 'draw' ? 0 : -1000;
    return s;
  },
  isAttacker(g, fac) { const id = g.scn.id; return (fac === 'C' && ['18.1', '18.3', '19.4', '20.8', '19.2'].includes(id)) || (fac === 'O' && ['20.6', '20.5', '19.8'].includes(id)); },
  strength(g, fac) { return g.friends(fac).reduce((s, u) => s + g.F(u) + g.D(u), 0); },
  // ---------------- obiettivi strategici
  objectives(g, fac) {
    const out = [], m = g.map, id = g.scn.id;
    const push = (h, v, kind) => { if (h) out.push({ h, v, kind }); };
    for (const h of m.hexes) {
      if (!h.feature) continue;
      const T = TERRAIN[h.terrain];
      let v = T.settlement ? 4 + T.pv * 3 + (T.gold || 0) : 3;
      if (h.terrain === 'tempio' || h.terrain === 'altare' || h.terrain === 'fenditura') v = 6;
      if (h.feature.type === 'testa') v = 10;
      if (h.terrain === 'rovina' && !h.explored) v = 5;
      if (h.key) v += 6;
      if (h.owner === fac) push(h, v * 0.8, 'defend'); else push(h, v, 'take');
    }
    if (id === '18.1') { const p = m.byName('Pietraluce'); push(p, 30, p.owner === fac ? 'defend' : 'take'); }
    if (id === '18.3') { const p = m.byName('Luminara'); push(p, 30, p.owner === fac ? 'defend' : 'take'); }
    if (id === '20.4') { const p = m.byName('Torre del Faro'); push(p, 30, p.owner === fac ? 'defend' : 'take'); }
    if (id === '19.4' && fac === 'C') for (const h of m.hexes) if (h.c === 0) push(h, 12, 'take');
    if (id === '19.4' && fac === 'O') { for (const h of m.hexes) if (h.c > m.W * 0.3 && h.c < m.W * 0.5 && h.terrain !== 'montagna') push(h, 5, 'defend'); }
    if (id === '19.3' || id === '20.6' || id === '20.5') {
      const name = id === '19.3' ? 'Reliquia' : id === '20.6' ? 'Lama del Giuramento Spezzato' : 'Sigillo';
      const c = SR.carry(g, name);
      if (c && c.fac !== fac) push(g.hexOf(c), 25, 'take');
      for (const hid of ((g.flags.dropped || {})[name] || [])) push(m.hexes[hid], 25, 'take');
      if (id === '20.6' && fac === 'O') push(m.hexes.find(h => h.terrain === 'tempio'), 40, 'take');
      if (id === '19.3' && c && c.fac === fac) push(m.hexes[g.flags.castle[fac]], 30, 'take');
    }
    if (id === '19.7') { const c = g.units.find(u => u.type === 'Colosso' && g.alive(u)); if (c && c.fac === 'N') push(g.hexOf(c), 20, 'take'); }
    // eroi nemici come bersagli secondari
    for (const u of g.friends(OTHER[fac])) if (u.commander) push(g.hexOf(u), 8, 'hunt');
    return out;
  },
  // pressione nemica: forza di mischia che può raggiungere ciascun esagono
  threatMap(g, fac) {
    const t = new Float32Array(g.map.hexes.length);
    for (const e of g.friends(OTHER[fac])) {
      if (e.fac === 'N' || g.st(e, 'dormiente')) continue;
      const r = g.V(e) + 1, h = g.hexOf(e), f = g.F(e);
      for (const x of g.map.hexes) { const d = g.map.dist(h, x); if (d <= r) t[x.id] += f * (d <= 1 ? 1 : 0.7); }
    }
    return t;
  },
  // ---------------- turno completo
  *turn(g, fac) {
    if (g.scn.coop && fac === 'C') { yield* AUTO_CHAOS.turn(g); return; }
    // reclutamento
    yield* this.recruitPhase(g, fac);
    g.nextPhase();
    yield { phase: 'move' };
    yield* this.movePhase(g, fac);
    g.nextPhase();
    yield { phase: 'combat' };
    yield* this.combatPhase(g, fac);
    g.nextPhase();
  },
  *recruitPhase(g, fac) {
    // oggetti: pozioni sulle unità ferite
    for (const u of g.friends(fac)) for (const it of g.consumables(u)) {
      if (it.name === 'Pozione di Guarigione' && g.curR(u) <= g.maxR(u) / 2) { g.useItem(u.uid, it.name); yield { act: 'item' }; }
    }
    if (fac === 'C') { const c = g.forcedMutationOptions().filter(u => u.grade === 'B' && g.U(u).cost >= 5).sort((a, b) => g.U(b).cost - g.U(a).cost)[0]; if (c && g.gold.C >= 12) { g.forcedMutation(c.uid); yield { act: 'mutation' }; } }
    if (fac === 'O') for (const u of g.trainOptions()) if (g.gold.O >= 14) g.train(u.uid);
    // costruzioni difensive negli insediamenti minacciati
    const threat = this.threatMap(g, fac);
    for (const h of g.settlements(fac)) {
      if (threat[h.id] < 6) continue;
      const b = g.buildOptions(h.id).filter(o => o.ok && (o.id === 'fortify' || o.id === 'repair'));
      if (b.length && g.gold[fac] >= b[0].cost + 8) { g.build(h.id, b[0].id); yield { act: 'build', hex: h.id }; }
    }
    // reclutamento
    let guard = 0;
    while (guard++ < 12) {
      const sites = g.recruitSites(fac).filter(h => g.recruitOptions(h.id, fac).list.some(o => o.ok));
      if (!sites.length) break;
      const enemies = g.friends(OTHER[fac]);
      const near = h => Math.min(99, ...enemies.map(e => g.map.dist(g.hexOf(e), h)));
      sites.sort((a, b) => near(a) - near(b));
      const site = sites[0];
      const opts = g.recruitOptions(site.id, fac).list.filter(o => o.ok);
      const mine = g.friends(fac);
      const ranged = mine.filter(u => g.has(u, 'Tiratore')).length / Math.max(1, mine.length);
      const casters = mine.filter(u => g.isCaster(u) && !g.isLeader(u)).length;
      const score = o => {
        const U = UNITS[o.type]; let s = (U.F + U.D + U.R * 1.5 + U.V * 0.5) / Math.sqrt(o.cost + 1);
        if (U.P > 0 && ranged < 0.3) s *= 1.4;
        if (U.FM >= 3 && casters < 2) s *= 1.5;
        if (U.kw.includes('Cavalleria') && near(site) > 4) s *= 1.15;
        if (near(site) <= 3) s *= 1 + U.D / 10;
        if (o.grade === 'V') s *= 1.1;
        return s * (0.8 + g.rng.next() * 0.4);
      };
      opts.sort((a, b) => score(b) - score(a));
      const keep = g.turn >= g.scn.turns - 1 ? 0 : 2;
      const pick = opts.find(o => g.gold[fac] - o.cost >= keep);
      if (!pick) break;
      g.recruit(site.id, pick.type, pick.grade);
      yield { act: 'recruit', hex: site.id };
    }
  },
  // ---------------- movimento
  *movePhase(g, fac) {
    const myStr = this.strength(g, fac), enStr = this.strength(g, OTHER[fac]);
    const aggr = Math.max(0.4, Math.min(1.6, myStr / Math.max(1, enStr)));
    const attackerRole = this.isAttacker(g, fac);
    const late = g.turn >= g.scn.turns - 2;
    let guard = 0;
    for (;;) {
      if (guard++ > 80) break;
      // pile con unità che possono muovere
      const stacks = new Map();
      for (const u of g.friends(fac)) if (g.canMove(u)) { if (!stacks.has(u.hex)) stacks.set(u.hex, []); stacks.get(u.hex).push(u); }
      if (!stacks.size) break;
      const enemies = g.friends(OTHER[fac]).filter(e => e.fac !== 'N');
      const distE = h => Math.min(99, ...enemies.map(e => g.map.dist(g.hexOf(e), h)));
      const order = [...stacks.entries()].sort((a, b) => distE(g.map.hexes[a[0]]) - distE(g.map.hexes[b[0]]));
      const [hid, us0] = order[0];
      let us = us0;
      const h0 = g.map.hexes[hid];
      // 19.4: chi è sul bordo dell'Ordine esce
      if (g.canExit(us[0])) { g.exitMap(us.filter(u => g.canExit(u)).map(u => u.uid)); yield { act: 'exit' }; continue; }
      // presidio: lascia un'unità negli insediamenti propri minacciati
      const threat = this.threatMap(g, fac);
      if (h0.feature && h0.owner === fac && distE(h0) <= 4) {
        const all = g.unitsAt(hid).filter(u => u.fac === fac);
        const stayers = all.filter(u => !g.canMove(u));
        if (stayers.filter(u => !g.isLeader(u)).length === 0 && us.length > 1) {
          const keep = us.filter(u => !g.isLeader(u)).sort((a, b) => g.D(b) - g.D(a))[0];
          if (keep) { keep.moved = true; us = us.filter(u => u !== keep); }
        } else if (us.length && h0.key) { for (const u of us) u.moved = true; continue; }
        if (!us.length) continue;
      }
      const objs = this.objectives(g, fac);
      const fly = us.every(u => g.canFly(u));
      const R = g.reachable(us, { fly });
      const cands = [hid, ...R.dests.keys()];
      const stackD = us.reduce((s, u) => s + g.D(u), 0), stackF = us.reduce((s, u) => s + g.F(u), 0);
      const ranged = us.every(u => g.has(u, 'Tiratore') || g.isCaster(u));
      const cav = us.some(u => g.has(u, 'Cavalleria') || g.has(u, 'Bestia'));
      const friendsNow = g.friends(fac).filter(u => !us.includes(u));
      const enemyStacks = new Map();
      for (const e of enemies) { const eh = g.hexOf(e); if (!enemyStacks.has(eh)) enemyStacks.set(eh, { D: 0, value: 0 }); const o = enemyStacks.get(eh); o.D += g.D(e); o.value += this.value(g, e); }
      let best = hid, bs = -Infinity;
      for (const id of cands) {
        const h = g.map.hexes[id];
        let s = 0;
        // obiettivi
        for (const o of objs) {
          const d = g.map.dist(h, o.h);
          if (o.kind === 'take') s += o.v * (attackerRole ? 1.3 : 1) * (0.6 + 0.4 * aggr) * (late ? 1.5 : 1) / (1 + d * 0.9) + (d === 0 && o.h.owner !== fac && !g.blockedAt(o.h.id, fac) ? o.v * 0.8 : 0);
          else if (o.kind === 'defend') { if (distE(o.h) <= 5) s += o.v * 0.9 / (1 + d * 1.2) + (d === 0 ? o.v * 0.4 : 0); }
          else s += o.v * aggr / (2 + d);
        }
        // avvicinamento al nemico se siamo più forti
        const de = distE(h);
        if (aggr > 1 || attackerRole) s += (aggr + (attackerRole ? 0.5 : 0)) * 6 / (1 + de);
        // sicurezza
        const def = (stackD + (g.unitsAt(id).filter(u => u.fac === fac && !us.includes(u)).reduce((a, u) => a + g.D(u), 0))) * (1 - (TERRAIN[h.terrain].melee || 0) * 0.25);
        const danger = threat[id] / Math.max(1, def);
        s -= Math.max(0, danger - (aggr > 1.2 ? 3 : 2.2)) * (ranged ? 5 : 2.2);
        if (ranged && de <= 1) s -= 5;
        if (ranged) { const inRange = enemies.some(e => g.map.dist(g.hexOf(e), h) <= Math.max(...us.map(u => g.P(u, h)))); if (inRange && de >= 2) s += 4; }
        // terreno e supporto
        s += -(TERRAIN[h.terrain].melee || 0) * 0.8;
        if (cav && (h.terrain === 'bosco' || h.terrain === 'palude')) s -= 2;
        const sup = friendsNow.filter(f => g.map.dist(g.hexOf(f), h) === 1).length;
        s += Math.min(3, sup) * 0.6;
        // possibilità d'attacco dal nuovo esagono
        if (!ranged) {
          // attrazione verso pile nemiche che possiamo battere (contando gli amici già vicini)
          for (const [eh, ed] of enemyStacks) {
            const d = g.map.dist(h, eh); if (d > 3) continue;
            const helpF = friendsNow.filter(f => g.map.dist(g.hexOf(f), eh) <= 1 && !g.has(f, 'Tiratore')).reduce((a, f) => a + g.F(f), 0);
            const ratio = (stackF + helpF) / Math.max(1, ed.D);
            if (ratio >= 1.5 - (attackerRole ? 0.3 : 0)) s += Math.min(6, ratio * 1.5 + ed.value / 10) * (0.7 + 0.3 * aggr) / (d === 1 ? 1 : d * 1.5);
          }
        }
        if (late && h.feature && h.owner !== fac) s += 6;
        // ordine fuori comando
        if (fac === 'O' && !us.some(u => g.isLeader(u)) && !g.friends('O').some(l => g.isLeader(l) && !us.includes(l) && g.map.dist(g.hexOf(l), h) <= 4)) s -= 1.5;
        if (id === hid) s += 0.3;
        if (s > bs) { bs = s; best = id; }
      }
      if (best === hid) { for (const u of us) u.moved = true; continue; }
      const r = g.move(us.map(u => u.uid), best, { fly });
      if (!r.ok) { for (const u of us) u.moved = true; continue; }
      if (g.pendingSack) this.decideSack(g);
      yield { act: 'move', path: r.path };
    }
  },
  decideSack(g) {
    const p = g.pendingSack; if (!p) return;
    const h = g.map.hexes[p.hex];
    if (p.fac === 'O') g.sack(p.hex, h.sacked ? 'none' : 'requisition');
    else g.sack(p.hex, h.sacked ? 'none' : (g.scn.id === '19.5' || g.scn.id === '20.7' ? 'normal' : 'violent'));
  },
  // ---------------- combattimento
  simulate(g, fn) {
    // valore atteso su tutti i tiri del dado
    const fac = g.active; const base = this.evaluate(g, fac); let ev = 0;
    for (let r = 1; r <= 6; r++) { const c = g.clone(); fn(c, r); ev += (this.evaluate(c, fac) - base) / 6; }
    return ev;
  },
  *combatPhase(g, fac) {
    const myStr = this.strength(g, fac), enStr = this.strength(g, OTHER[fac]);
    const aggr = Math.max(0.5, Math.min(1.5, myStr / Math.max(1, enStr)));
    const attackerRole = this.isAttacker(g, fac);
    // Furia
    for (const u of g.friends(fac)) if (g.canFury(u) && g.map.neighbors(g.hexOf(u)).some(n => g.enemyAt(n.id, fac))) { g.fury(u.uid); }
    // abilità degli Eroi
    for (const u of g.friends(fac)) for (const ab of g.heroAbilities(u)) {
      if (ab.id === 'sussurri') { const t = ab.targets.map(t => g.byUid(t.uid)).sort((a, b) => g.moraleValue(a) - g.moraleValue(b))[0]; if (t && !g.immuneMorale(t)) { g.useHeroAbility(u.uid, 'sussurri', { uid: t.uid }); yield { act: 'ability' }; } }
    }
    // magie
    for (const c of g.friends(fac).filter(u => g.isCaster(u))) {
      let tries = 0;
      while (g.canCast(c) && tries++ < 2) {
        const best = this.bestSpell(g, c);
        if (!best || best.score < 1.5) break;
        g.cast(c.uid, best.sp.name, best.t, { mode: best.mode });
        yield { act: 'spell', name: best.sp.name, hex: best.t.hex };
        if (g.winner) return;
      }
    }
    // tiri a distanza
    for (let k = 0; k < 20; k++) {
      const shooters = g.friends(fac).filter(u => g.canShoot(u));
      if (!shooters.length) break;
      const targets = new Set(); for (const s of shooters) for (const x of g.map.within(g.hexOf(s), g.P(s))) if (g.enemyAt(x.id, fac)) targets.add(x.id);
      let best = null;
      for (const t of targets) {
        const sh = g.rangedCandidates(t); if (!sh.length) continue;
        const ev = this.simulate(g, (c, r) => c.ranged(sh.map(u => u.uid), t, { roll: r }));
        // preferisci i bersagli che si attaccheranno in mischia
        const adjMelee = g.map.neighbors(g.map.hexes[t]).some(n => g.unitsAt(n.id).some(u => u.fac === fac && g.canAttack(u) && !g.has(u, 'Tiratore')));
        const sc = ev + (adjMelee ? 1 : 0);
        if (!best || sc > best.sc) best = { t, sh, sc };
      }
      if (!best || best.sc <= 0.2) break;
      g.ranged(best.sh.map(u => u.uid), best.t);
      yield { act: 'ranged', hex: best.t };
      if (g.winner) return;
    }
    // mischia
    for (let k = 0; k < 25; k++) {
      const atk = g.friends(fac).filter(u => g.canAttack(u));
      if (!atk.length) break;
      const targets = new Set(); for (const a of atk) for (const n of g.map.neighbors(g.hexOf(a))) if (g.canBeMeleed(n.id)) targets.add(n.id);
      let best = null;
      for (const t of targets) {
        let cand = g.meleeCandidates(t).filter(u => !(u.type === 'Guaritori'));
        // i tiratori deboli non partecipano se non servono
        const variants = [cand];
        const strong = cand.filter(u => !g.has(u, 'Tiratore') || g.F(u) >= 3);
        if (strong.length && strong.length < cand.length) variants.push(strong);
        const noRiver = cand.filter(u => { const e = g.map.edge(g.hexOf(u), g.map.hexes[t]); return !e || e.type !== 'fiume'; });
        if (noRiver.length && noRiver.length < cand.length) variants.push(noRiver);
        for (const v of variants) {
          if (!v.length) continue;
          const ev = this.simulate(g, (c, r) => { const o = c.melee(v.map(u => u.uid), t, { roll: r }); if (o.canAdvance && o.canAdvance.length) c.advance(o.canAdvance, t); });
          const h = g.map.hexes[t];
          let sc = ev + (h.feature && h.owner !== fac ? 3 : 0) * aggr;
          if (g.unitsAt(t).some(u => u.commander)) sc += 4;
          if (!best || sc > best.sc) best = { t, v, sc };
        }
      }
      const thr = Math.max(-1, Math.min(1, 0.4 - (aggr - 1) * 1.2 - (attackerRole ? 0.6 : 0) - (g.turn >= g.scn.turns - 2 ? 0.6 : 0)));
      if (!best || best.sc < thr) break;
      const out = g.melee(best.v.map(u => u.uid), best.t);
      yield { act: 'melee', hex: best.t };
      if (out.ok && out.canAdvance && out.canAdvance.length) {
        const h = g.map.hexes[best.t];
        const threat = this.threatMap(g, fac);
        const go = h.feature || (TERRAIN[h.terrain].melee || 0) < 0 || threat[h.id] < 8 || g.scn.coop;
        if (go) { g.advance(out.canAdvance, best.t); if (g.pendingSack) this.decideSack(g); yield { act: 'advance', hex: best.t }; }
      }
      if (g.winner) return;
    }
    g.toSpecialStep();
    yield { act: 'morale' };
    // azioni speciali
    for (const u of g.friends(fac)) {
      const opts = g.specialOptions(u); if (!opts.length) continue;
      const pick = opts.find(o => o.id === 'awaken') || opts.find(o => o.id === 'explore') || opts.find(o => o.id === 'cleanse') || opts.find(o => o.id === 'breach')
        || opts.filter(o => o.id === 'purify' || o.id === 'corrupt').sort((a, b) => this.hexStateValue(g, b.hex, fac) - this.hexStateValue(g, a.hex, fac))[0];
      if (pick) { g.doSpecial(u.uid, pick.id, pick.hex, { uid: pick.uid }); yield { act: 'special', hex: pick.hex }; }
    }
  },
  hexStateValue(g, hid, fac) {
    const h = g.map.hexes[hid]; let v = 1;
    if (h.feature) v += 4; if (h.key) v += 6;
    if (fac === 'O' && h.state === 'corrotto') v += 2;
    if (g.unitsAt(hid).some(u => u.fac === fac)) v += 1;
    return v;
  },
  bestSpell(g, c) {
    let best = null;
    const fac = c.fac;
    for (const { sp, cost, ok } of g.spellsFor(c)) {
      if (!ok) continue;
      for (const t of g.spellTargets(c, sp)) {
        let s = 0, mode;
        const us = g.unitsAt(t.hex), tu = t.uid !== undefined ? g.byUid(t.uid) : null;
        const enemies = us.filter(u => u.fac !== fac), friends = us.filter(u => u.fac === fac);
        const pSucc = fac === 'O' ? 0.83 : 0.66;
        const killV = (u, d) => (g.curR(u) <= d ? this.value(g, u) : this.value(g, u) * d / g.maxR(u) * 0.8);
        switch (sp.name) {
          case 'Colonna di Fuoco': { const one = Math.max(0, ...enemies.map(u => killV(u, 3))); const all = enemies.reduce((a, u) => a + killV(u, 1), 0); s = Math.max(one, all); mode = one >= all ? 'unit' : 'hex'; break; }
          case 'Purga del Caos': s = killV(tu, 3); break;
          case 'Frattura della Realtà': s = killV(tu, 4); break;
          case 'Tentacoli della Corruzione': s = killV(tu, 2) + 1; break;
          case 'Vampata Mutante': case 'Pioggia di Cenere Nera': s = enemies.reduce((a, u) => a + killV(u, 1), 0) - friends.reduce((a, u) => a + killV(u, 1), 0); break;
          case 'Luce Guaritrice': s = Math.min(2, tu.dmg) * this.value(g, tu) / g.maxR(tu) * 0.8; break;
          case 'Barriera di Luce': case 'Aura di Disciplina': { const thr = this.threatMap(g, fac)[t.hex]; s = thr > 6 ? friends.length * 2 + 1 : 0; if (sp.name === 'Aura di Disciplina') s = g.friends(fac).filter(u => g.map.dist(g.hexOf(u), g.map.hexes[t.hex]) <= 1 && g.map.neighbors(g.hexOf(u)).some(n => g.enemyAt(n.id, fac))).length * 2; break; }
          case 'Sigillo di Immobilità': s = g.F(tu) >= 5 || tu.commander ? 4 : 1; break;
          case 'Giuramento di Ferro': s = g.isLeader(tu) || g.U(tu).cost >= 8 ? (g.map.neighbors(g.hexOf(tu)).some(n => g.enemyAt(n.id, fac)) ? 3 : 0.5) : 0; break;
          case 'Scudo di Fede': s = g.map.neighbors(g.hexOf(tu)).some(n => g.enemyAt(n.id, fac)) ? this.value(g, tu) / 8 : 0; break;
          case 'Purificazione del Terreno': { const h = g.map.hexes[t.hex]; s = h.state === 'corrotto' ? (h.feature ? 5 : 2) : (h.feature && h.owner === 'O' ? 1.6 : 0); break; }
          case "Chiamata all'Ordine": s = g.friends(fac).filter(u => g.st(u, 'disgregato') && g.map.dist(g.hexOf(u), g.hexOf(c)) <= 3).length * 2.5; break;
          case 'Sussurro della Fenditura': s = g.immuneMorale(tu) ? 0 : this.value(g, tu) * 0.12 * (7 - g.moraleValue(tu, -1)) / 6; break;
          case 'Urlo del Vuoto': s = g.map.neighbors(g.hexOf(c)).flatMap(n => g.unitsAt(n.id)).filter(u => u.fac !== fac && !g.immuneMorale(u)).length * 1.5; break;
          case 'Piaga Strisciante': { const h = g.map.hexes[t.hex]; s = enemies.length * 2 + (h.feature && h.owner !== fac ? 2 : 0) + (h.key ? 4 : 0) - friends.length * 2; break; }
          case 'Furia Bestiale': s = g.map.neighbors(g.hexOf(tu)).some(n => g.enemyAt(n.id, fac)) ? g.F(tu) * 0.5 : 0; break;
          case 'Dono Mutante': s = g.U(tu).cost >= 6 && tu.mutF < 2 ? 1.6 : 0; break;
          case 'Risveglio Demoniaco': { const h = g.map.hexes[t.hex]; s = g.map.neighbors(h).some(n => g.enemyAt(n.id, fac)) ? 5 : 2; break; }
        }
        s = s * pSucc - cost * 0.25;
        if (!best || s > best.score) best = { sp, t, score: s, mode };
      }
    }
    return best;
  },
};

// ------------------------------------------------------------
//  Caos automatico (20.2) per gli scenari cooperativi
// ------------------------------------------------------------
const AUTO_CHAOS = {
  target(g, h) {
    if (g.scn.id === '20.4') return g.map.byName('Torre del Faro');
    const sets = g.map.hexes.filter(x => TERRAIN[x.terrain].settlement && x.owner !== 'C');
    if (sets.length) return sets.sort((a, b) => g.map.dist(a, h) - g.map.dist(b, h))[0];
    const heroes = g.friends('O').filter(u => g.isLeader(u));
    if (heroes.length) return g.hexOf(heroes.sort((a, b) => g.map.dist(g.hexOf(a), h) - g.map.dist(g.hexOf(b), h))[0]);
    return null;
  },
  *turn(g) {
    g.nextPhase(); // niente reclutamento: la Generazione avviene in Manutenzione
    yield { phase: 'move' };
    const O = () => g.friends('O');
    const dO = h => Math.min(99, ...O().map(u => g.map.dist(g.hexOf(u), h)));
    let guard = 0;
    for (;;) {
      if (guard++ > 80) break;
      const stacks = new Map();
      for (const u of g.friends('C')) if (g.canMove(u)) { if (!stacks.has(u.hex)) stacks.set(u.hex, []); stacks.get(u.hex).push(u); }
      if (!stacks.size) break;
      const [hid, us] = [...stacks.entries()].sort((a, b) => dO(g.map.hexes[a[0]]) - dO(g.map.hexes[b[0]]))[0];
      const h = g.map.hexes[hid];
      if (dO(h) <= 1) { for (const u of us) u.moved = true; continue; }
      const T = this.target(g, h); if (!T) { for (const u of us) u.moved = true; continue; }
      const R = g.reachable(us, {});
      let best = null, bd = g.map.dist(h, T) * 10;
      for (const [id, cost] of R.dests) { const d = g.map.dist(g.map.hexes[id], T) * 10 + cost * 0.1; if (d < bd) { bd = d; best = id; } }
      if (best === null) { for (const u of us) u.moved = true; continue; }
      const r = g.move(us.map(u => u.uid), best);
      if (!r.ok) { for (const u of us) u.moved = true; continue; }
      if (g.pendingSack) g.sack(g.pendingSack.hex, 'violent');
      yield { act: 'move', path: r.path };
    }
    g.nextPhase();
    yield { phase: 'combat' };
    for (const u of g.friends('C')) if (g.canFury(u)) g.fury(u.uid);
    // magie
    for (const c of g.friends('C').filter(u => g.isCaster(u))) {
      if (!g.canCast(c)) continue;
      const dmg = g.spellsFor(c).filter(x => x.ok && x.sp.dmg).sort((a, b) => b.cost - a.cost);
      let done = false;
      for (const x of dmg) {
        const ts = g.spellTargets(c, x.sp); if (!ts.length) continue;
        const byHex = {}; for (const t of ts) byHex[t.hex] = t;
        const t = Object.values(byHex).sort((a, b) => g.unitsAt(b.hex).filter(u => u.fac === 'O').length - g.unitsAt(a.hex).filter(u => u.fac === 'O').length)[0];
        g.cast(c.uid, x.sp.name, t, { mode: 'hex' }); done = true; yield { act: 'spell', hex: t.hex }; break;
      }
      if (!done) { const sp = g.spellsFor(c).find(x => x.ok && x.sp.name === 'Sussurro della Fenditura'); if (sp) { const ts = g.spellTargets(c, sp.sp).sort((a, b) => g.map.dist(g.map.hexes[a.hex], g.hexOf(c)) - g.map.dist(g.map.hexes[b.hex], g.hexOf(c))); if (ts.length) { g.cast(c.uid, sp.sp.name, ts[0]); yield { act: 'spell', hex: ts[0].hex }; } } }
    }
    const ftD = hid => g.unitsAt(hid).reduce((s, u) => s + g.D(u), 0);
    // tiri
    for (const s of g.friends('C').filter(u => g.canShoot(u))) {
      if (!g.canShoot(s)) continue;
      const ts = g.map.within(g.hexOf(s), g.P(s)).filter(x => g.enemyAt(x.id, 'C') && g.lineOfSight(g.hexOf(s), x, [s])).sort((a, b) => ftD(a.id) - ftD(b.id));
      if (ts.length) { g.ranged([s.uid], ts[0].id); yield { act: 'ranged', hex: ts[0].id }; }
    }
    // mischia: tutti gli adiacenti a uno stesso esagono attaccano insieme, verso il FT più basso
    for (let k = 0; k < 30; k++) {
      const atk = g.friends('C').filter(u => g.canAttack(u)); if (!atk.length) break;
      const choice = new Map();
      for (const a of atk) { const ts = g.map.neighbors(g.hexOf(a)).filter(n => g.canBeMeleed(n.id)).sort((x, y) => ftD(x.id) - ftD(y.id)); if (ts.length) { if (!choice.has(ts[0].id)) choice.set(ts[0].id, []); choice.get(ts[0].id).push(a); } }
      if (!choice.size) break;
      const [t, us] = [...choice.entries()][0];
      const out = g.melee(us.map(u => u.uid), t);
      yield { act: 'melee', hex: t };
      if (out.ok && out.canAdvance && out.canAdvance.length) { g.advance(out.canAdvance, t); if (g.pendingSack) g.sack(g.pendingSack.hex, 'violent'); }
      if (g.winner) return;
    }
    g.toSpecialStep();
    for (const u of g.friends('C')) { const o = g.specialOptions(u).find(o => o.id === 'corrupt'); if (o) g.doSpecial(u.uid, o.id, o.hex); }
    g.nextPhase();
  },
};

// ============================================================
//  DISEGNO DELLA MAPPA (strato statico, in stile mappa illustrata)
// ============================================================
const PAL = {
  O: ['#f0b84a', '#f3cf5e', '#e99a3c', '#f6dd7a'],
  C: ['#e2445f', '#d6345a', '#e8697f', '#c9304c'],
  ink: '#3b2210', inkSoft: 'rgba(70,35,10,0.55)',
  tint: { bosco: ['#b8c24a', 0.45], palude: ['#bcd8cf', 0.6], deserto: ['#f6e2a2', 0.55], montagna: ['#d1ab83', 0.35], collina: ['#c98f3e', 0.12], pianura: ['#000', 0], lago: ['#93d3ea', 1] },
  faction: { O: '#2a5d9f', C: '#a3222f', N: '#7b7468' },
};
const MARGIN = 70;

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }
function shade(a, f) { const A = hexToRgb(a); return 'rgb(' + A.map(v => Math.max(0, Math.min(255, Math.round(v * f)))).join(',') + ')'; }
function hexPath(ctx, x, y, s = HEX) { ctx.beginPath(); for (let i = 0; i < 6; i++) { const [px, py] = hexCorner(x, y, i, s); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); }
function chaikin(pts, it = 2) {
  for (let k = 0; k < it; k++) {
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; out.push([x0 * 0.75 + x1 * 0.25, y0 * 0.75 + y1 * 0.25], [x0 * 0.25 + x1 * 0.75, y0 * 0.25 + y1 * 0.75]); }
    out.push(pts[pts.length - 1]); pts = out;
  }
  return pts;
}
function strokePoly(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke(); }
function spacedText(ctx, text, x, y, spacing) {
  const w = [...text].map(ch => ctx.measureText(ch).width);
  const tot = w.reduce((a, b) => a + b, 0) + spacing * (text.length - 1);
  let cx = x - tot / 2;
  [...text].forEach((ch, i) => { ctx.strokeText && ctx.lineWidth > 0 && ctx.strokeText(ch, cx + w[i] / 2, y); ctx.fillText(ch, cx + w[i] / 2, y); cx += w[i] + spacing; });
}

function regionColor(m, h) {
  const reg = m.regions[h.region] || { side: m.half(h), pal: 0 };
  return PAL[reg.side][reg.pal % 4];
}
function hexFill(m, h) {
  const base = regionColor(m, h);
  const t = h.terrain === 'lago' ? 'lago' : (h.base || h.terrain);
  const [c, k] = PAL.tint[t] || ['#000', 0];
  return k ? mix(base, c, k) : base;
}

// ---------------- illustrazioni del terreno
function drawHill(ctx, x, y, s, R) {
  ctx.beginPath(); ctx.moveTo(x - s, y); ctx.quadraticCurveTo(x - s * 0.2, y - s * 1.25, x + s, y);
  ctx.fillStyle = 'rgba(255,235,190,0.35)'; ctx.fill(); ctx.stroke();
  ctx.save(); ctx.lineWidth *= 0.7;
  for (let i = 0; i < 4; i++) { const t = 0.25 + i * 0.16; const px = x - s * 0.2 + s * t * 1.1; const py = y - s * (0.85 - t * 0.85); ctx.beginPath(); ctx.moveTo(px, py + 1); ctx.lineTo(px + s * 0.12, y - 0.5); ctx.stroke(); }
  ctx.restore();
}
function drawMountain(ctx, x, y, s, R) {
  const h = s * R.range(1.2, 1.6), lx = x - s, rx = x + s, tx = x + R.range(-0.2, 0.2) * s;
  ctx.beginPath(); ctx.moveTo(lx, y); ctx.lineTo(tx - s * 0.15, y - h * 0.7); ctx.lineTo(tx, y - h); ctx.lineTo(tx + s * 0.25, y - h * 0.72); ctx.lineTo(rx, y); ctx.closePath();
  ctx.fillStyle = '#f3e3c2'; ctx.fill();
  // lato in ombra
  ctx.beginPath(); ctx.moveTo(tx, y - h); ctx.lineTo(tx + s * 0.25, y - h * 0.72); ctx.lineTo(rx, y); ctx.lineTo(tx + s * 0.05, y); ctx.closePath(); ctx.fillStyle = 'rgba(120,70,30,0.45)'; ctx.fill();
  // neve
  ctx.beginPath(); ctx.moveTo(tx - s * 0.15, y - h * 0.7); ctx.lineTo(tx, y - h); ctx.lineTo(tx + s * 0.25, y - h * 0.72); ctx.lineTo(tx + s * 0.08, y - h * 0.78); ctx.lineTo(tx - s * 0.02, y - h * 0.68); ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(lx, y); ctx.lineTo(tx - s * 0.15, y - h * 0.7); ctx.lineTo(tx, y - h); ctx.lineTo(tx + s * 0.25, y - h * 0.72); ctx.lineTo(rx, y); ctx.stroke();
  ctx.save(); ctx.lineWidth *= 0.6;
  for (let i = 1; i < 5; i++) { const t = i / 5; ctx.beginPath(); ctx.moveTo(tx + (rx - tx) * t * 0.9, y - h * (1 - t) * 0.95); ctx.lineTo(tx + (rx - tx) * t * 0.6, y - 1); ctx.stroke(); }
  ctx.restore();
}
function drawTree(ctx, x, y, s, R) {
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + s * 0.5); ctx.stroke();
  const g = R.chance(0.5) ? '#d4dc63' : '#b5c94a';
  ctx.beginPath();
  const n = 7; for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2, rr = s * (0.82 + R.range(-0.12, 0.12)); const px = x + Math.cos(a) * rr, py = y - s * 0.25 + Math.sin(a) * rr * 0.9; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath(); ctx.fillStyle = g; ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(60,80,10,0.55)'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + R.range(-0.4, 0.5) * s, y - s * 0.25 + R.range(-0.3, 0.5) * s, s * 0.12, 0, 7); ctx.fill(); }
}

function drawTerrain(ctx, m, h) {
  const R = new RNG(h.id * 9973 + m.seed);
  const t = h.base || h.terrain;
  ctx.save();
  hexPath(ctx, h.x, h.y, HEX * 0.98); ctx.clip();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.1; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (t === 'collina') {
    const pts = []; for (let i = 0; i < 6; i++) pts.push([h.x + R.range(-24, 22), h.y + R.range(-20, 26)]);
    pts.sort((a, b) => a[1] - b[1]); pts.forEach(p => drawHill(ctx, p[0], p[1], R.range(8, 12), R));
  } else if (t === 'montagna') {
    const pts = [[h.x - 14, h.y - 8], [h.x + 12, h.y - 12], [h.x - 2, h.y + 6], [h.x - 20, h.y + 22], [h.x + 18, h.y + 20]];
    pts.forEach(p => { p[0] += R.range(-4, 4); p[1] += R.range(-4, 4); });
    pts.sort((a, b) => a[1] - b[1]); pts.forEach(p => drawMountain(ctx, p[0], p[1], R.range(11, 15), R));
  } else if (t === 'bosco') {
    const pts = []; for (let i = 0; i < 11; i++) pts.push([h.x + R.range(-28, 28), h.y + R.range(-26, 28)]);
    pts.sort((a, b) => a[1] - b[1]); ctx.lineWidth = 0.9; pts.forEach(p => drawTree(ctx, p[0], p[1], R.range(6, 8.5), R));
  } else if (t === 'palude') {
    ctx.strokeStyle = 'rgba(40,90,100,0.8)';
    for (let i = 0; i < 9; i++) { const x = h.x + R.range(-28, 22), y = h.y + R.range(-26, 26); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + R.range(6, 12), y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(70,90,30,0.9)';
    for (let i = 0; i < 5; i++) { const x = h.x + R.range(-24, 24), y = h.y + R.range(-20, 24); for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + k * 3, y - 8 + Math.abs(k) * 2); ctx.stroke(); } }
  } else if (t === 'deserto') {
    ctx.fillStyle = 'rgba(120,70,20,0.5)';
    for (let i = 0; i < 26; i++) { ctx.beginPath(); ctx.arc(h.x + R.range(-30, 30), h.y + R.range(-28, 28), 0.9, 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(120,70,20,0.6)';
    for (let i = 0; i < 2; i++) { const x = h.x + R.range(-18, 8), y = h.y + R.range(-10, 18); ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10, y - 7, x + 22, y); ctx.stroke(); }
  } else if (t === 'pianura' && !h.feature) {
    ctx.strokeStyle = 'rgba(90,50,15,0.45)'; ctx.lineWidth = 0.9;
    for (let i = 0; i < 4; i++) { const x = h.x + R.range(-24, 24), y = h.y + R.range(-22, 24); ctx.beginPath(); ctx.moveTo(x - 2.5, y - 3); ctx.lineTo(x, y); ctx.lineTo(x + 2.5, y - 3.5); ctx.stroke(); }
  }
  ctx.restore();
}

// ---------------- icone di insediamenti e luoghi
function drawHouse(ctx, x, y, s, roof) {
  ctx.fillStyle = '#f4ead2'; ctx.fillRect(x - s / 2, y - s * 0.55, s, s * 0.55); ctx.strokeRect(x - s / 2, y - s * 0.55, s, s * 0.55);
  ctx.beginPath(); ctx.moveTo(x - s * 0.62, y - s * 0.5); ctx.lineTo(x, y - s * 1.05); ctx.lineTo(x + s * 0.62, y - s * 0.5); ctx.closePath(); ctx.fillStyle = roof; ctx.fill(); ctx.stroke();
}
function drawTower(ctx, x, y, w, hgt, roof) {
  ctx.fillStyle = '#efe6d2'; ctx.fillRect(x - w / 2, y - hgt, w, hgt); ctx.strokeRect(x - w / 2, y - hgt, w, hgt);
  const n = 3, cw = w / (n * 2 - 1);
  for (let i = 0; i < n; i++) { ctx.fillStyle = '#efe6d2'; ctx.fillRect(x - w / 2 + i * cw * 2, y - hgt - cw, cw, cw); ctx.strokeRect(x - w / 2 + i * cw * 2, y - hgt - cw, cw, cw); }
  if (roof) { ctx.beginPath(); ctx.moveTo(x - w * 0.6, y - hgt - cw); ctx.lineTo(x, y - hgt - cw - w * 0.9); ctx.lineTo(x + w * 0.6, y - hgt - cw); ctx.closePath(); ctx.fillStyle = roof; ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = '#3b2210'; ctx.fillRect(x - w * 0.12, y - hgt * 0.55, w * 0.24, hgt * 0.22);
}
function drawFlag(ctx, x, y, color) {
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x + 11, y - 13); ctx.lineTo(x, y - 9); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.stroke();
}
function drawFeature(ctx, m, h, zoomLabel = true) {
  const f = h.feature, x = h.x, y = h.y + 4;
  ctx.save();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.1; ctx.lineJoin = 'round';
  const roofO = '#c4472f', roofC = '#5b3a5e';
  const roof = f.owner === 'C' ? roofC : roofO;
  // medaglione di fondo come nelle mappe illustrate
  const medal = (r, fill) => { ctx.beginPath(); ctx.arc(x, y - 6, r, 0, 7); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 1.4; ctx.stroke(); ctx.lineWidth = 1.1; };
  switch (f.type) {
    case 'citta': case 'cittamag': {
      medal(f.type === 'cittamag' ? 21 : 18, '#e9d9b6');
      const H = [[-8, 2], [3, 3], [-2, -6], [9, -4], [-10, -8]];
      H.forEach(([dx, dy], i) => drawHouse(ctx, x + dx, y + dy, 8.5, i % 2 ? roof : shade(roof, 0.8)));
      break;
    }
    case 'castello': {
      medal(19, '#ded2bb');
      ctx.fillStyle = '#efe6d2'; ctx.fillRect(x - 14, y - 10, 28, 12); ctx.strokeRect(x - 14, y - 10, 28, 12);
      drawTower(ctx, x - 10, y + 2, 8, 18, roof); drawTower(ctx, x + 10, y + 2, 8, 18, roof); drawTower(ctx, x, y + 1, 10, 24, null);
      break;
    }
    case 'castellomag': case 'capitale': {
      medal(f.type === 'capitale' ? 26 : 23, '#d9ccb2');
      ctx.fillStyle = '#efe6d2'; ctx.fillRect(x - 18, y - 12, 36, 14); ctx.strokeRect(x - 18, y - 12, 36, 14);
      drawTower(ctx, x - 15, y + 3, 8, 20, roof); drawTower(ctx, x + 15, y + 3, 8, 20, roof);
      drawTower(ctx, x - 5, y + 2, 9, 27, roof); drawTower(ctx, x + 6, y + 2, 9, 24, null);
      if (f.type === 'capitale') { ctx.fillStyle = '#d9a227'; ctx.beginPath(); ctx.moveTo(x - 6, y - 42); ctx.lineTo(x - 3, y - 47); ctx.lineTo(x, y - 42); ctx.lineTo(x + 3, y - 47); ctx.lineTo(x + 6, y - 42); ctx.lineTo(x + 6, y - 39); ctx.lineTo(x - 6, y - 39); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      break;
    }
    case 'tempio': {
      medal(18, '#f3efe3');
      ctx.fillStyle = '#fbf8ee';
      ctx.beginPath(); ctx.moveTo(x - 15, y - 12); ctx.lineTo(x, y - 22); ctx.lineTo(x + 15, y - 12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillRect(x - 15, y - 12, 30, 3); ctx.strokeRect(x - 15, y - 12, 30, 3);
      for (let i = 0; i < 5; i++) { ctx.fillRect(x - 13 + i * 6, y - 9, 3, 13); ctx.strokeRect(x - 13 + i * 6, y - 9, 3, 13); }
      ctx.fillRect(x - 17, y + 4, 34, 3); ctx.strokeRect(x - 17, y + 4, 34, 3);
      ctx.fillStyle = '#e8b93a'; ctx.beginPath(); ctx.arc(x, y - 16, 2.2, 0, 7); ctx.fill();
      break;
    }
    case 'altare': {
      const g = ctx.createRadialGradient(x, y - 6, 2, x, y - 6, 24); g.addColorStop(0, 'rgba(255,60,40,0.75)'); g.addColorStop(1, 'rgba(120,0,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 6, 24, 0, 7); ctx.fill();
      ctx.fillStyle = '#3a2a33'; ctx.beginPath(); ctx.moveTo(x - 6, y + 4); ctx.lineTo(x - 3, y - 26); ctx.lineTo(x + 3, y - 26); ctx.lineTo(x + 6, y + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#58434e'; ctx.fillRect(x - 14, y - 2, 28, 7); ctx.strokeRect(x - 14, y - 2, 28, 7);
      ctx.fillStyle = '#ff6a3a'; ctx.beginPath(); ctx.arc(x, y - 18, 2.5, 0, 7); ctx.fill();
      break;
    }
    case 'fenditura': {
      const g = ctx.createRadialGradient(x, y - 4, 2, x, y - 4, 26); g.addColorStop(0, 'rgba(200,80,255,0.8)'); g.addColorStop(1, 'rgba(70,0,90,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 4, 26, 0, 7); ctx.fill();
      ctx.fillStyle = '#1e0b26'; ctx.beginPath(); ctx.moveTo(x - 4, y - 24); ctx.lineTo(x + 3, y - 14); ctx.lineTo(x - 2, y - 8); ctx.lineTo(x + 6, y + 2); ctx.lineTo(x + 1, y + 12); ctx.lineTo(x - 3, y + 2); ctx.lineTo(x - 8, y - 6); ctx.lineTo(x - 3, y - 13); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#d78cff'; ctx.lineWidth = 1.3; ctx.stroke();
      break;
    }
    case 'rovina': {
      medal(17, '#d8ccb5');
      ctx.fillStyle = '#ece3cf';
      [[-11, 16], [-4, 22], [4, 12], [11, 18]].forEach(([dx, hh]) => { ctx.beginPath(); ctx.moveTo(x + dx - 2.5, y + 3); ctx.lineTo(x + dx - 2.5, y + 3 - hh); ctx.lineTo(x + dx, y + 1 - hh); ctx.lineTo(x + dx + 2.5, y + 4 - hh); ctx.lineTo(x + dx + 2.5, y + 3); ctx.closePath(); ctx.fill(); ctx.stroke(); });
      ctx.fillRect(x - 15, y + 3, 30, 3); ctx.strokeRect(x - 15, y + 3, 30, 3);
      ctx.beginPath(); ctx.ellipse(x + 15, y + 1, 4, 2.5, 0.3, 0, 7); ctx.fill(); ctx.stroke();
      break;
    }
    case 'testa': {
      ctx.fillStyle = '#f2e6c4'; ctx.beginPath(); ctx.arc(x, y - 6, 12, 0, 7); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x, y - 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(x + 12, y - 16); ctx.lineTo(x, y - 11); ctx.closePath(); ctx.fillStyle = '#e8c547'; ctx.fill(); ctx.stroke();
      break;
    }
  }
  if (f.type !== 'testa' && (TERRAIN[h.terrain] && (TERRAIN[h.terrain].settlement || TERRAIN[h.terrain].place))) drawFlag(ctx, x + 14, y - 18, PAL.faction[f.owner || 'N']);
  ctx.restore();
}

function drawEdgeFeatures(ctx, m) {
  const segOf = (a, b) => { const i = m.dirTo(a, b); return [hexCorner(a.x, a.y, i), hexCorner(a.x, a.y, (i + 1) % 6)]; };
  for (const [k, e] of m.edges) {
    const [ia, ib] = k.split('_').map(Number); const a = m.hexes[ia], b = m.hexes[ib];
    const [p1, p2] = segOf(a, b);
    const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    const ux = (b.x - a.x) / (HEX * SQ3), uy = (b.y - a.y) / (HEX * SQ3); // da a verso b
    const vx = (p2[0] - p1[0]) / HEX, vy = (p2[1] - p1[1]) / HEX;     // lungo il lato
    ctx.save();
    if (e.type === 'ponte') {
      ctx.translate(mx, my); ctx.rotate(Math.atan2(uy, ux));
      ctx.fillStyle = '#b07b45'; ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1;
      ctx.fillRect(-11, -5, 22, 10); ctx.strokeRect(-11, -5, 22, 10);
      for (let i = -7; i <= 7; i += 4.5) { ctx.beginPath(); ctx.moveTo(i, -5); ctx.lineTo(i, 5); ctx.stroke(); }
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-12, -6); ctx.lineTo(12, -6); ctx.moveTo(-12, 6); ctx.lineTo(12, 6); ctx.stroke();
    } else if (e.type === 'guado') {
      ctx.translate(mx, my); ctx.rotate(Math.atan2(uy, ux));
      ctx.fillStyle = '#d8d2c4'; ctx.strokeStyle = '#4a4036'; ctx.lineWidth = 0.9;
      [[-9, -3], [-4, 3], [0, -2.5], [4, 3], [9, -1]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 2.8, 2, 0.4, 0, 7); ctx.fill(); ctx.stroke(); });
    } else if (e.type === 'cresta') {
      const low = e.high === a.id ? b : a, high = e.high === a.id ? a : b;
      const lx = (low.x - high.x) / (HEX * SQ3), ly = (low.y - high.y) / (HEX * SQ3);
      ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 3.2; ctx.lineJoin = 'miter';
      const pts = []; const n = 8;
      for (let i = 0; i <= n; i++) { const t = i / n; const j = (i % 2 ? 2.5 : -1.5); pts.push([p1[0] + (p2[0] - p1[0]) * t + lx * j, p1[1] + (p2[1] - p1[1]) * t + ly * j]); }
      ctx.strokeStyle = 'rgba(60,30,10,0.85)'; ctx.lineWidth = 4.4; strokePoly(ctx, pts);
      ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 2.4; strokePoly(ctx, pts);
      ctx.strokeStyle = 'rgba(60,30,10,0.75)'; ctx.lineWidth = 1;
      for (let i = 1; i < n; i += 1) { const t = i / n; const sx = p1[0] + (p2[0] - p1[0]) * t + lx * 2, sy = p1[1] + (p2[1] - p1[1]) * t + ly * 2; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + lx * 6, sy + ly * 6); ctx.stroke(); }
    } else if (e.type === 'mura') {
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 7; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
      ctx.strokeStyle = '#cfc6b4'; ctx.lineWidth = 5; ctx.stroke();
      ctx.fillStyle = '#cfc6b4'; ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) { const t = (i + 0.5) / 5; const cx = p1[0] + (p2[0] - p1[0]) * t, cy = p1[1] + (p2[1] - p1[1]) * t; ctx.fillRect(cx - 2.5, cy - 2.5, 5, 5); ctx.strokeRect(cx - 2.5, cy - 2.5, 5, 5); }
    } else if (e.type === 'barriera') {
      ctx.strokeStyle = 'rgba(160,120,255,0.9)'; ctx.lineWidth = 4; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
    }
    ctx.restore();
  }
}

function roadPoints(m, path) {
  const pts = path.map(id => [m.hexes[id].x, m.hexes[id].y]);
  // leggero ondeggiamento deterministico per un tratto disegnato a mano
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    const R = new RNG(path[i] * 31 + path[i + 1]);
    const nx = -(y1 - y0), ny = x1 - x0, L = Math.hypot(nx, ny) || 1, w = R.range(-5, 5);
    out.push([(x0 + x1) / 2 + nx / L * w, (y0 + y1) / 2 + ny / L * w]);
    out.push(pts[i + 1]);
  }
  return chaikin(out, 2);
}

function renderStaticMap(game) {
  const m = game.map;
  const WW = m.pxW + MARGIN * 2, HH = m.pxH + MARGIN * 2;
  const S = Math.min(2, 4096 / Math.max(WW, HH));
  const cv = document.createElement('canvas'); cv.width = Math.ceil(WW * S); cv.height = Math.ceil(HH * S);
  const ctx = cv.getContext('2d');
  const W2 = (c) => c.setTransform(S, 0, 0, S, MARGIN * S, MARGIN * S);
  // ---- pergamena
  ctx.fillStyle = '#ead6aa'; ctx.fillRect(0, 0, cv.width, cv.height);
  const R = new RNG(m.seed + 5);
  for (let i = 0; i < cv.width * cv.height / 900; i++) { ctx.fillStyle = `rgba(${R.chance(0.5) ? '120,80,30' : '255,250,230'},${R.range(0.03, 0.09)})`; ctx.fillRect(R.next() * cv.width, R.next() * cv.height, R.range(1, 3) * S, R.range(1, 3) * S); }
  // ---- colori di regione sfumati (aerografo)
  const blur = document.createElement('canvas'); blur.width = cv.width; blur.height = cv.height;
  const bx = blur.getContext('2d'); W2(bx);
  for (const h of m.hexes) { hexPath(bx, h.x, h.y, HEX + 0.8); bx.fillStyle = hexFill(m, h); bx.fill(); }
  // bordi di regione più scuri, solo sfumati
  const bnd = document.createElement('canvas'); bnd.width = cv.width; bnd.height = cv.height;
  const nx = bnd.getContext('2d'); W2(nx); nx.lineCap = 'round';
  for (const h of m.hexes) for (let i = 0; i < 3; i++) {
    const n = m.nb(h, i); if (!n || n.region === h.region) continue;
    const [p1, p2] = [hexCorner(h.x, h.y, i), hexCorner(h.x, h.y, (i + 1) % 6)];
    nx.strokeStyle = 'rgba(120,40,10,0.45)'; nx.lineWidth = 14; nx.beginPath(); nx.moveTo(p1[0], p1[1]); nx.lineTo(p2[0], p2[1]); nx.stroke();
  }
  ctx.save(); ctx.filter = `blur(${Math.round(5 * S)}px)`; ctx.drawImage(blur, 0, 0); ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.55; ctx.drawImage(blur, 0, 0); ctx.restore();
  ctx.save(); ctx.filter = `blur(${Math.round(7 * S)}px)`; ctx.globalAlpha = 0.8; ctx.drawImage(bnd, 0, 0); ctx.restore();
  // ritaglia il bordo della mappa
  W2(ctx);
  // ---- grana
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  for (let i = 0; i < m.hexes.length * 30; i++) { ctx.fillStyle = `rgba(110,60,20,${R.range(0.04, 0.12)})`; ctx.fillRect(R.next() * m.pxW, R.next() * m.pxH, R.range(0.6, 1.6), R.range(0.6, 1.6)); }
  ctx.restore();
  // ---- laghi
  const lakes = m.hexes.filter(h => h.terrain === 'lago');
  if (lakes.length) {
    ctx.save(); ctx.lineJoin = 'round';
    ctx.strokeStyle = '#3d8db5'; ctx.lineWidth = 7; lakes.forEach(h => { hexPath(ctx, h.x, h.y, HEX * 0.9); ctx.stroke(); });
    ctx.fillStyle = '#9ad7ee'; ctx.strokeStyle = '#9ad7ee'; ctx.lineWidth = 5; lakes.forEach(h => { hexPath(ctx, h.x, h.y, HEX * 0.9); ctx.fill(); ctx.stroke(); });
    ctx.strokeStyle = 'rgba(40,110,160,0.5)'; ctx.lineWidth = 1;
    lakes.forEach(h => { const r = new RNG(h.id); for (let i = 0; i < 5; i++) { const x = h.x + r.range(-22, 12), y = h.y + r.range(-20, 20); ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 5, y - 3, x + 10, y); ctx.stroke(); } });
    ctx.restore();
  }
  // ---- stati: corrotto / purificato
  for (const h of m.hexes) {
    if (h.state === 'corrotto') {
      ctx.save(); hexPath(ctx, h.x, h.y, HEX); ctx.clip();
      ctx.fillStyle = 'rgba(80,10,90,0.28)'; ctx.fill();
      const r = new RNG(h.id * 3 + 1); ctx.strokeStyle = 'rgba(40,0,50,0.55)'; ctx.lineWidth = 1.1;
      for (let k = 0; k < 4; k++) { let x = h.x + r.range(-10, 10), y = h.y + r.range(-10, 10); ctx.beginPath(); ctx.moveTo(x, y); for (let j = 0; j < 5; j++) { x += r.range(-9, 9); y += r.range(-9, 9); ctx.lineTo(x, y); } ctx.stroke(); }
      ctx.restore();
    } else if (h.state === 'purificato') {
      const g = ctx.createRadialGradient(h.x, h.y, 4, h.x, h.y, HEX); g.addColorStop(0, 'rgba(255,250,200,0.65)'); g.addColorStop(1, 'rgba(255,240,170,0.05)');
      hexPath(ctx, h.x, h.y, HEX); ctx.fillStyle = g; ctx.fill();
    }
  }
  // ---- illustrazioni del terreno
  for (const h of m.hexes) if (h.terrain !== 'lago') drawTerrain(ctx, m, h);
  // ---- griglia
  ctx.save(); ctx.strokeStyle = 'rgba(90,40,10,0.32)'; ctx.lineWidth = 0.9;
  for (const h of m.hexes) { hexPath(ctx, h.x, h.y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(70,30,5,0.45)'; ctx.font = '7px sans-serif'; ctx.textAlign = 'center';
  for (const h of m.hexes) ctx.fillText(String(h.c + 1).padStart(2, '0') + String(h.r + 1).padStart(2, '0'), h.x, h.y - HEX * 0.68);
  ctx.restore();
  // ---- fiumi
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const rv of m.rivers) {
    const pts = chaikin(rv.pts, 3);
    ctx.strokeStyle = '#2f7fae'; ctx.lineWidth = 6; strokePoly(ctx, pts);
    ctx.strokeStyle = '#7fcdea'; ctx.lineWidth = 3.6; strokePoly(ctx, pts);
  }
  ctx.restore();
  // ---- strade
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const rd of m.roads) {
    const pts = roadPoints(m, rd.path);
    ctx.strokeStyle = 'rgba(255,245,220,0.55)'; ctx.lineWidth = 5; ctx.setLineDash([]); strokePoly(ctx, pts);
    ctx.strokeStyle = '#24150a'; ctx.lineWidth = rd.main ? 2.6 : 2.2; ctx.setLineDash(rd.main ? [] : [7, 5]); strokePoly(ctx, pts);
  }
  ctx.restore();
  // ---- lati speciali
  drawEdgeFeatures(ctx, m);
  // ---- esagoni chiave
  ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2.4;
  for (const h of m.hexes) if (h.key) { hexPath(ctx, h.x, h.y, HEX * 0.86); ctx.stroke(); }
  ctx.restore();

const Anim = {
  // durata (ms) e se blocca la coda
  spec(e) {
    const sp = App.speed;
    switch (e.type) {
      case 'move': return { dur: (e.fast ? 90 : 150) * Math.max(1, e.path.length - 1) / sp, block: true };
      case 'melee': case 'ranged': return { dur: 750 / sp, block: true };
      case 'spell': return { dur: 900 / sp, block: true };
      case 'death': return { dur: 450 / sp, block: true };
      case 'turn': return { dur: 1100 / sp, block: true };
      case 'recruit': case 'summon': return { dur: 300 / sp, block: true };
      case 'capture': case 'loot': case 'explore': case 'build': return { dur: 350 / sp, block: true };
      default: return { dur: 0, block: false };
    }
  },
  update() {
    const now = performance.now();
    let guard = 0;
    while (guard++ < 50) {
      if (App.anim) {
        const a = App.anim; a.p = Math.min(1, (now - a.t0) / Math.max(1, a.dur));
        if (a.p < 1) break;
        this.finish(a); App.anim = null;
      }
      if (!App.evq.length) break;
      const e = App.evq.shift();
      this.begin(e);
      const s = this.spec(e);
      if (s.block && s.dur > 0) App.anim = { e, t0: now, dur: s.dur, p: 0 };
    }
    App.floats = App.floats.filter(f => now - f.t0 < f.dur);
  },
  hexXY(id) { const h = App.g.map.hexes[id]; return h ? [h.x, h.y] : [0, 0]; },
  float(hid, text, color, opt = {}) { const [x, y] = this.hexXY(hid); App.floats.push({ x: x + (opt.dx || 0), y: y + (opt.dy || 0), text, color, t0: performance.now() + (opt.delay || 0), dur: (opt.dur || 1400) / App.speed + (opt.delay || 0), size: opt.size || 15, box: opt.box }); },
  begin(e) {
    const g = App.g;
    switch (e.type) {
      case 'damage': this.float(e.hex, '−' + e.n, '#ff3a20', { size: 20, dy: -10 }); break;
      case 'heal': this.float(e.hex, '+R', '#40d060', { size: 16 }); break;
      case 'status': this.float(e.hex, e.s, e.s === 'Disgregato' ? '#d0d0d0' : e.s === 'Corrotto' ? '#c070f0' : '#ffd060', { dy: 18 }); break;
      case 'promote': this.float(e.hex, e.grade === 'E' ? 'Elite!' : 'Veterano!', '#f2d27a', { dy: -24 }); break;
      case 'morale': this.float(e.hex, `Morale ${e.roll} ${e.ok ? '✓' : '✗'}`, e.ok ? '#a0e0ff' : '#ff9070', { dy: 26, size: 12 }); break;
      case 'melee': { const r = e.res.replace(/\*/g, ''); this.float(e.hex, `⚔ ${e.col} · 🎲${e.roll} → ${e.res}`, '#fff', { dy: -34, size: 13, box: e.fac === 'O' ? '#1e3c78' : '#7a1420', dur: 2400 }); break; }
      case 'ranged': this.float(e.hex, `➶ ${e.col} · 🎲${e.roll} → ${e.res}`, '#fff', { dy: -34, size: 13, box: e.fac === 'O' ? '#1e3c78' : '#7a1420', dur: 2400 }); break;
      case 'spell': break;
      case 'capture': this.float(e.hex, 'Conquistata!', e.fac === 'O' ? '#9cc4ff' : '#ff8a8a', { dy: -30, size: 14 }); App.mapDirty = true; break;
      case 'loot': this.float(e.hex, `+${e.gold} Oro${e.items && e.items.length ? ' · ' + e.items.join(', ') : ''}`, '#ffd040', { dy: 30, size: 12, dur: 2200 }); break;
      case 'hexstate': case 'build': case 'explore': App.mapDirty = true; break;
      case 'turn': App.banner = { text: `Turno ${e.turn} · ${FACTION_NAME[e.fac]}`, sub: g.human ? (e.fac === g.human ? 'Tocca a te' : 'Muove l’avversario') : '', t0: performance.now(), dur: 1300 / App.speed, fac: e.fac }; break;
      case 'over': App.mapDirty = true; break;
      case 'exit': this.float(e.hex, 'Esce dalla mappa', '#ffd0a0'); break;
    }
  },
  finish(a) {
    const e = a.e;
    if (e.type === 'spell') { if (e.fail) this.float(e.hex, 'Fallita', '#c0c0c0', { dy: -20 }); else if (e.level) this.float(e.hex, e.level, '#ffe080', { dy: -20, size: 13 }); }
  },
  movePos(a) {
    const path = a.e.path, n = path.length - 1;
    if (n <= 0) return this.hexXY(path[0]);
    const t = a.p * n, i = Math.min(n - 1, Math.floor(t)), f = t - i;
    const ease = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
    const [x0, y0] = this.hexXY(path[i]), [x1, y1] = this.hexXY(path[i + 1]);
    return [x0 + (x1 - x0) * ease, y0 + (y1 - y0) * ease - Math.sin(ease * Math.PI) * 5];
  },
  arrow(c, x0, y0, x1, y1, dashed) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const sx = x0 + ux * 14, sy = y0 + uy * 14, ex = x1 - ux * 16, ey = y1 - uy * 16;
    c.save(); if (dashed) c.setLineDash([6, 6]);
    c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex - ux * 10 - uy * 6, ey - uy * 10 + ux * 6); c.lineTo(ex - ux * 10 + uy * 6, ey - uy * 10 - ux * 6); c.closePath(); c.fillStyle = c.strokeStyle; c.fill();
    c.restore();
  },
  // disegno nello spazio della mappa
  drawWorld(c) {
    const a = App.anim, now = performance.now();
    if (a) {
      const e = a.e, p = a.p;
      if (e.type === 'melee' || e.type === 'ranged') {
        const [tx, ty] = this.hexXY(e.hex);
        c.save();
        for (const f of e.from) {
          const [fx, fy] = this.hexXY(f);
          if (e.type === 'ranged') {
            // frecce in volo
            for (let k = 0; k < 3; k++) { const q = Math.min(1, Math.max(0, p * 1.6 - k * 0.15)); if (q <= 0 || q >= 1) continue; const x = fx + (tx - fx) * q, y = fy + (ty - fy) * q - Math.sin(q * Math.PI) * 30; const ang = Math.atan2((ty - fy) - Math.cos(q * Math.PI) * 30 * Math.PI / 2 * 0, tx - fx); c.save(); c.translate(x + k * 4, y); c.rotate(ang); c.strokeStyle = '#2a1a0a'; c.lineWidth = 2; c.beginPath(); c.moveTo(-9, 0); c.lineTo(7, 0); c.stroke(); c.fillStyle = '#2a1a0a'; c.beginPath(); c.moveTo(9, 0); c.lineTo(4, -3); c.lineTo(4, 3); c.fill(); c.restore(); }
          } else {
            const q = p < 0.5 ? p * 2 : 2 - p * 2;
            c.strokeStyle = `rgba(255,60,30,${0.9 - p * 0.6})`; c.lineWidth = 4;
            const mx = fx + (tx - fx) * (0.35 + q * 0.3), my = fy + (ty - fy) * (0.35 + q * 0.3);
            this.arrow(c, fx, fy, mx, my);
          }
        }
        if (p > 0.45) {
          const q = (p - 0.45) / 0.55;
          c.globalAlpha = 1 - q; c.fillStyle = e.type === 'melee' ? '#ffe070' : '#ffffff';
          c.beginPath(); for (let i = 0; i < 16; i++) { const r = (i % 2 ? 10 : 28) * (0.6 + q); const an = i / 16 * Math.PI * 2; c.lineTo(tx + Math.cos(an) * r, ty + Math.sin(an) * r); } c.closePath(); c.fill();
        }
        c.restore();
      }
      if (e.type === 'spell') {
        const [fx, fy] = this.hexXY(e.from), [tx, ty] = this.hexXY(e.hex);
        const col = e.fac === 'O' ? [255, 230, 140] : [190, 60, 255];
        c.save();
        const icon = IMG['M:' + e.name];
        if (p < 0.55) {
          const q = p / 0.55, x = fx + (tx - fx) * q, y = fy + (ty - fy) * q - Math.sin(q * Math.PI) * 40;
          const gr = c.createRadialGradient(x, y, 2, x, y, 26); gr.addColorStop(0, `rgba(${col},0.95)`); gr.addColorStop(1, `rgba(${col},0)`);
          c.fillStyle = gr; c.beginPath(); c.arc(x, y, 26, 0, 7); c.fill();
          for (let k = 1; k < 6; k++) { const qq = Math.max(0, q - k * 0.04), xx = fx + (tx - fx) * qq, yy = fy + (ty - fy) * qq - Math.sin(qq * Math.PI) * 40; c.fillStyle = `rgba(${col},${0.5 - k * 0.08})`; c.beginPath(); c.arc(xx, yy, 7 - k, 0, 7); c.fill(); }
        } else {
          const q = (p - 0.55) / 0.45;
          if (!e.fail) {
            c.globalAlpha = 1 - q;
            const gr = c.createRadialGradient(tx, ty, 4, tx, ty, 30 + q * 50); gr.addColorStop(0, `rgba(${col},0.9)`); gr.addColorStop(1, `rgba(${col},0)`);
            c.fillStyle = gr; c.beginPath(); c.arc(tx, ty, 30 + q * 50, 0, 7); c.fill();
            c.strokeStyle = `rgb(${col})`; c.lineWidth = 3; c.beginPath(); c.arc(tx, ty, 10 + q * 45, 0, 7); c.stroke();
          } else { c.globalAlpha = 1 - q; c.fillStyle = 'rgba(80,80,80,0.6)'; for (let k = 0; k < 6; k++) { c.beginPath(); c.arc(tx + Math.cos(k) * q * 30, ty - q * 20 + Math.sin(k * 2) * 8, 8 * (1 - q) + 2, 0, 7); c.fill(); } }
        }
        if (icon) { c.globalAlpha = p < 0.8 ? 1 : (1 - p) * 5; const s = 54; c.drawImage(icon, fx - s / 2, fy - s - 26, s, s); c.strokeStyle = '#000'; c.lineWidth = 1.5; c.strokeRect(fx - s / 2, fy - s - 26, s, s); }
        c.restore();
      }
      if (e.type === 'recruit' || e.type === 'summon') {
        const [x, y] = this.hexXY(e.hex); const u = App.g.byUid(e.uid);
        if (u) { c.save(); const s = HEX * 1.18 * (0.3 + 0.7 * p); c.globalAlpha = p; drawCounter(c, u, x, y, s); c.restore(); }
        c.save(); c.strokeStyle = `rgba(255,240,180,${1 - p})`; c.lineWidth = 3; c.beginPath(); c.arc(x, y, 10 + p * 40, 0, 7); c.stroke(); c.restore();
      }
      if (e.type === 'capture' || e.type === 'loot' || e.type === 'build' || e.type === 'explore') {
        const [x, y] = this.hexXY(e.hex); c.save(); c.strokeStyle = `rgba(255,215,80,${1 - p})`; c.lineWidth = 4; hexPath(c, x, y, HEX * (0.6 + 0.5 * p)); c.stroke(); c.restore();
      }
    }
    // testi fluttuanti
    for (const f of App.floats) {
      const q = (now - f.t0) / (f.dur - 0); if (q < 0) continue;
      c.save(); c.globalAlpha = q > 0.75 ? (1 - q) * 4 : 1;
      const y = f.y - q * 22;
      c.font = `bold ${f.size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
      if (f.box) { const w = c.measureText(f.text).width + 14; c.fillStyle = f.box; roundRect(c, f.x - w / 2, y - f.size * 0.8, w, f.size * 1.6, 5); c.fill(); c.strokeStyle = '#f2d27a'; c.lineWidth = 1; c.stroke(); }
      else { c.strokeStyle = 'rgba(0,0,0,0.85)'; c.lineWidth = 3.5; c.strokeText(f.text, f.x, y); }
      c.fillStyle = f.color; c.fillText(f.text, f.x, y);
      c.restore();
    }
  },
  // disegno nello spazio dello schermo (striscioni)
  drawScreen(c) {
    const b = App.banner; if (!b) return;
    const q = (performance.now() - b.t0) / b.dur; if (q >= 1) { App.banner = null; return; }
    const al = q < 0.15 ? q / 0.15 : q > 0.8 ? (1 - q) / 0.2 : 1;
    const W = App.W - App.panelW, y = App.H * 0.38;
    c.save(); c.globalAlpha = al;
    const gr = c.createLinearGradient(0, 0, W, 0); const col = b.fac === 'C' ? '120,16,30' : b.fac === 'O' ? '24,52,120' : '60,40,20';
    gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(0.2, `rgba(${col},0.88)`); gr.addColorStop(0.8, `rgba(${col},0.88)`); gr.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = gr; c.fillRect(0, y - 40, W, b.sub ? 92 : 76);
    c.fillStyle = '#f6e7c4'; c.font = `bold 32px ${SERIF}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(b.text, W / 2, y - 4);
    if (b.sub) { c.font = `italic 15px ${SERIF}`; c.fillStyle = '#f2d27a'; c.fillText(b.sub, W / 2, y + 30, W - 40); }
    c.restore();
  },
};

const Hud = {
  top(c) {
    const g = App.g, W = App.W;
    c.save();
    const grd = c.createLinearGradient(0, 0, 0, 48); grd.addColorStop(0, '#4a2f18'); grd.addColorStop(1, '#2e1d0f');
    c.fillStyle = grd; c.fillRect(0, 0, W, 48); c.fillStyle = '#c9a25a'; c.fillRect(0, 47, W, 1.5);
    c.restore();
    App.button(c, 8, 9, 64, 30, '☰ Menu', () => Modals.menu(), { size: 12 });
    let x = 82;
    c.save(); c.textBaseline = 'middle'; c.textAlign = 'left';
    const wide = W > 1250;
    if (wide) { c.fillStyle = '#f2d27a'; c.font = `bold 15px ${SERIF}`; c.fillText(`${g.scn.id} ${g.scn.title}`, x, 17, 300); c.fillStyle = '#c9b48a'; c.font = `italic 11.5px ${SERIF}`; c.fillText(`Seme ${g.seed}${g.human ? ' · tu giochi ' + FACTION_NAME[g.human] : ' · IA contro IA'}`, x, 34, 300); x += 310; }
    // turno e fase
    c.fillStyle = '#f6e7c4'; c.font = `bold 15px ${FONT}`;
    const tt = `TG ${g.turn}/${g.scn.turns}`; c.fillText(tt, x, 24); x += c.measureText(tt).width + 12;
    const fac = g.active, fc = fac === 'O' ? '#3d6fd0' : '#c0283a';
    const ph = g.phase === 'combat' ? `${PHASE_NAME.combat}: ${STEP_NAME[Math.min(3, g.step)]}` : PHASE_NAME[g.phase] || g.phase;
    const lab = `${FACTION_NAME[fac]} · ${ph}`; c.font = `bold 13px ${FONT}`;
    const lw = c.measureText(lab).width + 22;
    c.fillStyle = fc; roundRect(c, x, 11, lw, 26, 13); c.fill(); c.fillStyle = '#fff'; c.fillText(lab, x + 11, 24.5); x += lw + 14;
    // risorse
    const res = (f, xx) => {
      const col = f === 'O' ? '#8fb4ff' : '#ff8f9a';
      c.fillStyle = col; c.font = `bold 12px ${FONT}`; c.fillText(FACTION_NAME[f], xx, 16);
      c.fillStyle = '#f6e7c4'; c.font = `12px ${FONT}`;
      const n = g.friends(f).length;
      c.fillText(`${g.gold[f]} Oro · ${g.pv(f)} PV · ${n} unità`, xx, 33);
    };
    if (W > 900) { res('O', x); res('C', x + 150); x += 300; }
    c.restore();
    let bx = W - 8;
    const B = (w, label, on, active) => { bx -= w; if (bx < x) return; App.button(c, bx, 9, w, 30, label, on, { active, size: 12 }); bx -= 6; };
    B(34, '?', () => App.show.help = !App.show.help, App.show.help);
    B(70, 'Legenda', () => App.show.legend = !App.show.legend, App.show.legend);
    B(70, 'Registro', () => App.show.log = !App.show.log, App.show.log);
    B(60, 'Adatta', () => App.fit());
    B(62, `▶ ×${App.speed}`, () => App.speed = App.speed >= 4 ? 1 : App.speed * 2);
  },
  bottom(c) {
    const g = App.g, W = App.W - App.panelW, H = App.H, y = H - 56;
    c.save();
    c.fillStyle = 'rgba(36,24,12,0.92)'; roundRect(c, 8, y, W - 16, 48, 8); c.fill(); c.strokeStyle = '#a07a4a'; c.lineWidth = 1; c.stroke();
    c.restore();
    // fasi
    const phases = [['recruit', 'Reclutamento'], ['move', 'Movimento'], ['combat', 'Combattimento'], ['final', 'Fine']];
    let x = 18;
    c.save(); c.textBaseline = 'middle'; c.font = `12px ${FONT}`;
    const compact = W < 900;
    if (!compact) for (const [k, l] of phases) {
      const cur = g.phase === k || (k === 'final' && (g.phase === 'final' || g.phase === 'endTG'));
      const lab = k === 'combat' && cur ? `${l}: ${STEP_NAME[Math.min(3, g.step)]}` : l;
      const w = c.measureText(lab).width + 18;
      c.fillStyle = cur ? '#8a5a22' : 'rgba(255,255,255,0.06)'; roundRect(c, x, y + 12, w, 24, 12); c.fill();
      c.fillStyle = cur ? '#fff' : '#a89070'; c.fillText(lab, x + 9, y + 24.5); x += w + 6;
    }
    c.restore();
    const bw = 190, bxx = W - 8 - bw - 8;
    if (g.winner) { App.button(c, bxx, y + 7, bw, 34, 'Risultato', () => Modals.over(), { bold: true, color: '#6a4a10' }); return; }
    if (g.phase === 'deploy' && g.human) {

    if (second) App.button(c, bxx - 150, y + 7, 142, 34, second[0], second[1], { disabled: busy });
    const tip = {
      recruit: 'Tocca un tuo insediamento per reclutare o costruire. Pozioni e addestramento sono nel pannello delle unità.',
      move: 'Tocca una tua pila: verdi gli esagoni raggiungibili. M = Marcia Forzata. Tasto destro o Esc per annullare.',
      combat: ['Seleziona un incantatore e scegli una magia dal pannello, oppure attacca subito.', 'Tocca un nemico evidenziato per tirare a distanza.', 'Tocca un nemico adiacente per la mischia.', 'Purificare, Corrompere, Esplorare: dal pannello delle unità.'][Math.min(3, g.step)],
    }[g.phase];
    if (tip) this.hint(c, x, y, tip, bxx - (second ? 160 : 10) - x);

  hint(c, x, y, t, w) { c.save(); c.fillStyle = '#d8c39a'; c.font = `italic 12px ${FONT}`; c.textBaseline = 'middle'; c.fillText(t, x + 6, y + 24.5, w || (App.W - App.panelW - x - 230)); c.restore(); },
  log(c) {
    const g = App.g, W = Math.min(520, App.W - App.panelW - 70), open = App.show.log;
    const lines = open ? 18 : 4, lh = 15, h = lines * lh + 14, x = 56, y = App.H - 64 - h;

    c.beginPath(); c.rect(x, y + 4, W, h - 8); c.clip();

      c.fillStyle = col; c.font = `${l.kind === 'turn' ? 'bold ' : ''}11.5px ${FONT}`;

  zoom(c) {

  tooltip(c) {
    const g = App.g, h = App.hover, [mx, my] = App.mouse;
    let t = TERRAIN[h.terrain].name;
    if (h.feature) t = h.feature.name + ' · ' + (h.feature.type === 'testa' ? 'Testa di guado' : TERRAIN[h.terrain].name) + (h.owner ? ' (' + FACTION_NAME[h.owner] + ')' : '');
    if (h.state !== 'normale') t += h.state === 'corrotto' ? ' · Corrotto' : ' · Purificato';
    const st = g.unitsAt(h.id); if (st.length) t += ` · ${st.length} ${st.length === 1 ? 'unità' : 'unità'} ${FACTION_NAME[st[0].fac] || ''}`;
    // anteprima d'attacco
    if (App.isHumanTurn() && g.phase === 'combat' && g.enemyAt(h.id, g.active)) {
      const pk = App.pickedUnits();
      const rc = g.step <= 1 ? g.rangedCandidates(h.id) : [], mc = g.meleeCandidates(h.id);
      const useR = rc.length && (pk.some(u => rc.includes(u)) || !mc.length);
      const cand = useR ? rc : mc; const sel = pk.filter(u => cand.includes(u));
      const us = sel.length ? sel : cand;
      if (us.length) { const pv = useR ? g.rangedPreview(us, h.id) : g.meleePreview(us, h.id); t += useR ? ` · Tiro: colonna ${pv.colName}` : ` · Mischia ${pv.ftA}:${pv.ftD} → colonna ${pv.colName}`; }
    }
    c.save(); c.font = `12px ${FONT}`; const w = Math.min(520, c.measureText(t).width + 16);
    let x = mx + 16, y = my + 18; if (x + w > App.W - App.panelW) x = mx - w - 10;
    c.fillStyle = 'rgba(30,18,8,0.9)'; roundRect(c, x, y, w, 24, 5); c.fill();
    c.fillStyle = '#f6e7c4'; c.textBaseline = 'middle'; c.fillText(t, x + 8, y + 12.5, w - 16); c.restore();
  },
  toast(c) {
    const t = App.toast; const W = App.W - App.panelW;
    c.save(); c.font = `bold 13px ${FONT}`; const w = Math.min(W - 40, c.measureText(t.text).width + 28);
    c.fillStyle = 'rgba(120,30,20,0.94)'; roundRect(c, (W - w) / 2, 60, w, 32, 8); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t.text, W / 2, 76.5, w - 20); c.restore();
  },
};
